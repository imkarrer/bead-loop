[package]
name = "bead-loop"
version = "0.2.0"
edition = "2021"
description = "Work beads with local models in any repo: a resident supervisor over three queues"
license = "MIT"

[[bin]]
name = "bead-supervisor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
