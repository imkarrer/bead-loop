[package]
name = "bead-loop"
version = "0.2.0"
edition = "2021"
description = "Work beads with local models in any repo: a resident supervisor over three queues"
license = "FSL-1.1-MIT"

[[bin]]
name = "bead-supervisor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: status --json keeps the key order the page and the tests read (slug first)
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
