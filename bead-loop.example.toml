# Copy to <repo>/.bead-loop.toml. TOML; every key optional. Any key from the global
# ~/.config/bead-loop/config.toml may appear here too and wins for this repo.
label = "delegate:qwen30b"            # bd ready -l LABEL picks the work           (default "delegate:local")
base = "master"                        # branch to fork from and PR into           (default: origin's HEAD)
setup = "npm ci"                       # runs in the fresh worktree before the worker (no node_modules there)
gate = "npm run typecheck && npm run lint"   # after the worker, before review; unset = CI is the gate
merge = "auto"                         # auto: the merge watcher squash-merges once every CI check is green
                                       # pipeline: the loop labels the PR (merge_label, default "automerge") and CI merges it
                                       # manual: PR only (the bead is held for you once green)
review_model = "acbox/reviewer"        # the model that judges the diff before the push, when no [[stages]] table
                                       # applies; unset = no review. A different family from the worker catches more
on_exhaust = "repeat"                  # repeat: cycle the stages until it lands | park: leave it for you (default)
# conflict_worker = "claude/sonnet"    # who rebases a PR that conflicts with the base (default: the last stage's worker)
# brief_model = "claude/sonnet"        # who writes the brief when a bead is parked for you — what each round tried, why it
                                       # failed, the question to answer (default: the last stage's worker; "none" for no brief)
# research_model = "acbox/reviewer"    # who writes the research brief before the first worker round (default: off)
# research = "first"                   # first: one brief per bead · every: refined after each send-back
# research_timeout = 900               # seconds a research round may run, capped by the stage's `timeout`; past it the
                                       # worker goes without a brief. A bead labelled `harness:aider` gets no research
                                       # round at all: whoever filed it already named its files
# adopt = true                         # open bead/* PRs from anyone join the loop and merge on green
# max_inflight = 2                     # PRs in the merge queue before the dev lane pauses; unset = no cap, bd's
                                       # dependencies are the only gate (the queues absorb the rest)
# merge_label = "automerge"            # the label merge = "pipeline" puts on each PR
# worker_timeout = 3600                # seconds per model session
# stall_compactions = 10                # opencode sessions only: abort a session past this many compactions
                                       # in it -- a read/compaction loop, not the model at work (0 disables)
# stall_steps = 60                      # opencode sessions only: abort a session past this many tool calls
                                       # since its last edit/write/patch call (0 disables)
# precheck_model = "acbox/reviewer"    # runs after the gate, before the review queue; SEND BACK is a failure,
                                       # anything else is not
# model = "devbox/coder"               # the worker when no [[stages]] table applies
# attach = "http://localhost:8080"     # an opencode server url; sessions run there and stream in its web UI

# Escalation, in order. Every send-back to the dev queue — the gate failing twice, a
# REJECT from review, CI red — is one failure; a stage takes the bead for the next
# `failures` of them, then the next stage does. So the bead reaches Claude below after
# 3 + 1 = 4 failures. Usually set once, globally, with [[lanes]] beside it (one lane per
# model server, so a round on the CPU box never holds the GPU's queue; docs/config.md).
# (`attempts` is the older name for `failures` and still reads.)
[[stages]]
worker = "devbox/coder"                # an opencode agent on the devbox provider; "aider:devbox/coder" is aider on
reviewer = "acbox/reviewer"            # the same server, given the files the bead names and the gate as its lint
failures = 3

[[stages]]
worker = "acbox/coder"                 # the 80B implements; the same reviewer judges
reviewer = "acbox/reviewer"
failures = 1
timeout = 14400                        # seconds; default worker_timeout

[[stages]]
worker = "claude/sonnet"               # runs in Claude Code instead of opencode
reviewer = "claude/sonnet"
failures = 1

# target_label = "work"                 # the label prefix that names a target (default "work")
                                       # a bead's work:NAME label sends the round to a [targets.NAME]
                                       # checkout instead of this beads repo; no such label, or none of
                                       # these tables, is today's behaviour unchanged (docs/design-targets.md)

# [targets.example]
# path = "~/src/euclid"                # the checkout the round works in; required
# base = "main"                        # branch to fork from and PR into           (default: base_remote's HEAD)
# base_remote = "upstream"              # remote base forks from                    (default: "upstream" when that
                                       # remote exists in the checkout, else "origin")
# push_remote = "origin"                # remote bead/* branches are pushed to       (default "origin")
# pr_repo = "brownnrl/euclid"           # owner/repo the PR is opened against        (default: base_remote's GitHub repo)
# setup = "npm ci"                      # runs in the fresh worktree before the worker
# gate = "npm test"                     # after the worker, before review
# merge = "external"                    # auto | pipeline | manual | external (someone else merges; the loop watches)
# merge_label = "automerge"             # the label merge = "pipeline" puts on each PR
# adopt = true                          # bead/* PRs from anyone on this target join the loop
# max_inflight = 1                      # PRs in the merge queue before the dev lane pauses on this target
# open_pr = "ask"                       # auto | ask (the operator publishes it)     (default "auto")
# pr_style = "plain"                    # loop | plain (a contribution, no loop id or line) (default "loop")
