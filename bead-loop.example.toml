# Copy to <repo>/.bead-loop.toml. TOML; every key optional. Any key from the global
# ~/.config/bead-loop/config.toml may appear here too and wins for this repo.
# Providers are global: [providers.NAME] parallel, probe, and url, the server a model's
# rounds call (docs/config.md, Providers). The loop reads both files when it starts.
label = "delegate:local"               # bd ready -l LABEL is the queue              (default "delegate:local")
base = "master"                        # branch to fork from and PR into            (default "main")
# remote = "origin"                    # where the base is fetched and bead/* pushed (default "origin")
setup = "npm ci"                       # runs in a fresh worktree before its first round
gate = "npm run typecheck && npm run lint"   # after the worker, whatever it reports; unset = CI is the gate
merge = "auto"                         # auto: the loop squash-merges once every check is green
                                       # pipeline: the loop labels the PR (merge_label) and CI merges it
                                       # manual: PR only (held for you once green)
                                       # external: a maintainer merges; the loop only watches
on_exhaust = "park"                    # park: leave it for you (default) | repeat: cycle the stages
# feedback = true                      # a review or comment from someone else sends the bead back, no failure
# conflict_worker = "claude/sonnet"    # who works a rebase or feedback round (default: the last stage's worker)
# brief_model = "claude/sonnet"        # the second opinion on a researcher's BLOCKED (default: the researcher)
# research_model = "acbox/coder"       # writes a brief before the first work round (default: off)
# research = "first"                   # "off" turns research off even with a research_model
# research_timeout = 900               # seconds a research round may run; past it the worker goes without a brief
# precheck_model = "acbox/utility"     # after the gate, reads the diff; SEND BACK is a failure
# adopt = true                         # open bead/* PRs from anyone join the merge queue
# max_inflight = 2                     # this repo's own open PRs before the dev lane pauses (default: no cap)
# max_open_prs = 1                     # global only: own open PRs across a repo and its targets
# update_behind = true                 # bring a PR behind the base up first (default: merge = "auto")
# merge_label = "automerge"            # the label merge = "pipeline" puts on each PR
# open_pr = "ask"                      # push and stop at a compare link for you to open (default "auto")
# pr_style = "plain"                   # loop: "ID: title" · plain: the bead's title and description
# worker_timeout = 3600                # seconds a work or review round may run, gate included
# sandbox = false                      # true: each round under bwrap, only its worktree, git dir, state and /tmp writable

# Escalation, in order. Every send-back (the gate failing twice, the pre-check's SEND BACK,
# a REJECT, CI red) is one failure; a stage takes the bead for its `attempts`, then the
# next stage does. Below, the bead reaches Claude after 2 failures and parks after 3.
# Usually set once, globally (docs/config.md, Stages).
[[stages]]
name = "local"
worker = "devbox/coder"                # MODEL "coder" on the devbox provider's server, with the loop's tools
reviewer = "acbox/reviewer"            # a different family from the worker catches more
attempts = 2

[[stages]]
name = "frontier"
worker = "claude/sonnet"               # one Claude Code turn, with Claude's own tools
reviewer = "claude/sonnet"
attempts = 1

# target_label = "work"                # the label prefix that names a target (default "work"):
                                       # a bead's work:NAME label sends it to [targets.NAME]

# [targets.example]
# path = "~/src/euclid"                # the checkout the round works in; required
# base = "main"                        # branch to fork from and PR into            (default "main")
# base_remote = "upstream"             # where the base is fetched from             (default "origin")
# push_remote = "origin"               # where bead/* branches are pushed: your fork (default "origin")
# pr_repo = "brownnrl/euclid"          # owner/repo the PR is opened against        (default: the checkout's own)
# setup = "npm ci"                     # runs in a fresh worktree before its first round
# gate = "npm test"                    # after the worker
# merge = "external"                   # the maintainer merges; the loop watches
# open_pr = "ask"                      # default "ask" when pr_repo is set
# pr_style = "plain"                   # default "plain" under ask
# max_inflight = 1                     # this target's own open PRs before its dev lane pauses
