# The checks, the merge, the deploy. Every step runs inside this repo's .flox/ (bd, git,
# jq, gh, node, shellcheck — .flox/env/manifest.toml) through the imkarrer/flox plugin.
# baml-cli is not a flox package; scripts/ensure-baml.sh downloads the pinned binary.
#
# The plugin ref is main, like inquire-platform's: the agent runs natively on NixOS,
# which has no /bin/bash, and the hooks' move to #!/usr/bin/env bash (a218a63) is on
# main only. Pin a tag again once one exists at or after a218a63.
#
# One shared agent, queue `self` on arcade-box, builds and tests every push and PR and
# merges a labelled PR (scripts/ci-merge.sh — the loop labels every PR it opens under
# merge = "pipeline", so the loop's own work lands without a hand on it). The deploy is
# a pull, not a push: the box the loop runs on is behind WSL's NAT where arcade-box cannot reach it,
# so bead-loop-deploy.timer there runs scripts/deploy.sh every two minutes, which downloads
# the release the `release` step published for origin/main into a clone of its own,
# installs it and recycles the stack — only when origin/main has moved. The same shape
# as the homelab's own deploys (ADR 0006).
#
# One agent serves every build on `self`, so every step has a timeout, the cheap steps
# go first, and a failing build cancels what is behind it. The pipeline's own setting
# "cancel intermediate builds" is the other half: a new push cancels the older build
# still running for the branch. The baml-cli download (scripts/ci.sh) lives beside the
# checkouts on the agent, so a later build does not fetch it again.
#
# What is proven on main: the BAML is formatted, its tests pass, the scripts and skills
# lint, and the packed binary has the subcommands the unit execs — and then, within two
# minutes of the release, that binary is what runs.

agents:
  queue: self

env:
  CI: "true"

steps:
  - label: ":hammer: baml fmt · tests"
    key: baml
    timeout_in_minutes: 25
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh baml

  - label: ":bash: scripts · skills"
    key: scripts
    timeout_in_minutes: 5
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh scripts

  - wait

  - label: ":package: packed binary"
    key: suite
    timeout_in_minutes: 15
    cancel_on_build_failing: true
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh suite

  - label: ":package: flox package"
    key: package
    timeout_in_minutes: 25
    cancel_on_build_failing: true
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh package

  - wait

  - label: ":github: automerge"
    key: automerge
    timeout_in_minutes: 2
    # Label and draft state are checked inside the script, against the live PR.
    if: build.pull_request.id != null
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci-merge.sh

  # main only: the tested commit's release binary, published as the GitHub release
  # main-<sha7>. The box's deploy (scripts/deploy.sh, on its timer) downloads exactly
  # the release origin/main names, so what runs is what this build proved.
  - label: ":package: release"
    key: release
    timeout_in_minutes: 15
    if: build.branch == "main" && build.pull_request.id == null
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh release
