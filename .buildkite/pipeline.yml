# The checks, the merge, the deploy. Every step runs inside this repo's .flox/ (cargo,
# rustc, clippy, rustfmt, gcc, bd, git, jq, gh, node, shellcheck — .flox/env/manifest.toml)
# through the imkarrer/flox plugin.
#
# The plugin ref is main, like inquire-platform's: the agent runs natively on NixOS,
# which has no /bin/bash, and the hooks' move to #!/usr/bin/env bash (a218a63) is on
# main only. Pin a tag again once one exists at or after a218a63.
#
# Two queues. `self` is ac-box's agent, which builds and tests every push and PR and
# merges a labelled PR (scripts/ci-merge.sh — the loop labels every PR it opens under
# merge = "pipeline", so the loop's own work lands without a hand on it). `devbox` is the
# agent on the box the loop runs on — this workstation, behind WSL's NAT, which ac-box
# cannot reach — and it does one thing: after a merge to main, deploy to itself
# (scripts/deploy.sh: fast-forward the live checkout, build, install, recycle the
# stack). Restarting the loop is safe from a pipeline step because the loop is not the
# agent: the rounds it is on are reopened with no failure when it comes back.
#
# One agent serves every build on `self`, so every step has a timeout, the cheap steps
# go first, and a failing build cancels what is behind it. The pipeline's own setting
# "cancel intermediate builds" is the other half: a new push cancels the older build
# still running for the branch. The cargo cache (scripts/ci.sh) lives beside the
# checkouts on the agent, so a build recompiles only what changed.
#
# What is proven on main: the crate builds, its unit tests pass, the scripts and skills
# lint, and the supervisor's state machine does what docs/state-machine.md says against
# the fresh binary (test/run.sh) — and then that binary is what runs.

agents:
  queue: self

env:
  CI: "true"
  CARGO_TERM_COLOR: never

steps:
  - label: ":rust: fmt · clippy · build · unit tests"
    key: rust
    timeout_in_minutes: 25
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh rust

  - label: ":bash: scripts · skills"
    key: scripts
    timeout_in_minutes: 5
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh scripts

  - wait

  - label: ":repeat: supervisor state machine"
    key: suite
    timeout_in_minutes: 15
    cancel_on_build_failing: true
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci.sh suite

  - wait

  - label: ":github: automerge"
    key: automerge
    timeout_in_minutes: 2
    # Label and draft state are checked inside the script, against the live PR.
    if: build.pull_request.id != null
    plugins:
      - imkarrer/flox#main:
          command: scripts/ci-merge.sh

  - label: ":rocket: deploy to devbox"
    key: deploy
    timeout_in_minutes: 20
    if: build.branch == "main"
    concurrency: 1
    concurrency_group: bead-loop/deploy
    agents:
      queue: devbox
    plugins:
      - imkarrer/flox#main:
          command: scripts/deploy.sh
