<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bead-loop</title>
<style>
  /* Solarized dark (Ethan Schoonover), the whole page. The 16 names are kept so a
     colour choice reads as the palette's own: base03 canvas, base02 panels, base01
     for what can be dim, base0 for text, base1 for what must be read first. */
  :root {
    --base03: #002b36; --base02: #073642; --base01: #586e75; --base00: #657b83;
    --base0: #839496; --base1: #93a1a1; --base2: #eee8d5; --base3: #fdf6e3;
    --yellow: #b58900; --orange: #cb4b16; --red: #dc322f; --magenta: #d33682;
    --violet: #6c71c4; --blue: #268bd2; --cyan: #2aa198; --green: #859900;
    --bg: var(--base03); --panel: var(--base02); --ink: var(--base0); --bright: var(--base1); --muted: var(--base01);
    --line: rgba(147, 161, 161, .14); --line-strong: rgba(147, 161, 161, .28);
    --accent: var(--blue); --ok: var(--green); --warn: var(--yellow); --bad: var(--red); --busy: var(--cyan);
    --worker: var(--cyan); --reviewer: var(--violet);
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  b, strong { color: var(--bright); font-weight: 600; }

  /* header: one bar, the units separated by rules */
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line-strong);
           padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 0; align-items: center; }
  header h1 { font-size: 15px; margin: 0 20px 0 0; letter-spacing: .04em; color: var(--base2); font-weight: 600; }
  .unit { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 18px; border-left: 1px solid var(--line-strong); color: var(--bright); }
  .unit:empty { display: none; }
  .unit .muted { color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--base01); display: inline-block; flex: none; }
  .dot.on { background: var(--ok); } .dot.warn { background: var(--orange); } .dot.bad { background: var(--bad); }
  .dot.busy { background: var(--busy); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 5px; border: 1px solid var(--line-strong);
           background: transparent; color: var(--bright); cursor: pointer; line-height: 1.3; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; } .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.cur, .seg button.cur:hover { background: var(--accent); color: var(--base03); }
  .seg button.cur.game { background: var(--orange); }

  main { padding: 20px; max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
  .card h2 { margin: 0; font-size: 17px; color: var(--base2); font-weight: 600; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { margin: 18px 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .card h3:first-child { margin-top: 0; }
  .card h3 .n { color: var(--bright); margin-left: 4px; }
  .card h3 .note { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .cfg { color: var(--muted); font-size: 13px; font-weight: 400; }
  .cfg .mono { color: var(--base00); }

  .chip { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 11.5px; line-height: 18px; font-weight: 600;
          letter-spacing: .02em; color: var(--base1); background: rgba(147, 161, 161, .12); vertical-align: 1px; white-space: nowrap; }
  .chip.ok { color: var(--base03); background: var(--ok); } .chip.warn { color: var(--base03); background: var(--warn); }
  .chip.bad { color: var(--base3); background: var(--bad); } .chip.busy { color: var(--base03); background: var(--busy); }
  .chip.worker { color: var(--worker); background: rgba(42, 161, 152, .14); }
  .chip.reviewer { color: var(--reviewer); background: rgba(108, 113, 196, .18); }
  .chip.n { min-width: 22px; text-align: center; color: var(--bright); }

  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 7px 12px 7px 0; vertical-align: top; border-top: 1px solid var(--line); }
  td:last-child, th:last-child { padding-right: 0; }
  tr:first-child td { border-top: 0; }
  th { border-top: 0; padding-top: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .id, .mono { font-family: var(--mono); font-size: 13px; }
  td.id { color: var(--accent); white-space: nowrap; }
  .muted { color: var(--muted); }
  td.act { text-align: right; white-space: nowrap; }
  td.title { color: var(--ink); max-width: 0; width: 100%; }
  td.title .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.fit { white-space: nowrap; }

  /* the two lanes: what each is on right now, readable from across the room */
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 800px) { .lanes { grid-template-columns: 1fr; } }
  .lane { padding: 14px 18px; border-radius: 8px; background: var(--base03); border-left: 4px solid var(--worker); min-height: 96px; }
  .lane.review { border-left-color: var(--reviewer); }
  .lane.idle { border-left-color: var(--base01); }
  .lane .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .lane .label .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .lane .bead { font: 600 26px/1.15 var(--mono); color: var(--accent); margin-top: 6px; }
  .lane .what { font-size: 15px; color: var(--base2); margin-top: 3px; line-height: 1.4; }
  .lane.idle .what { color: var(--muted); font-style: italic; margin-top: 10px; }
  .lane .stage { margin-top: 10px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* the three queues, in the order the lanes take them */
  .queues { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 0 28px; margin-top: 6px; }
  @media (max-width: 1000px) { .queues { grid-template-columns: 1fr; } }
  .q h3 { margin-bottom: 2px; } .q .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .q.dev h3 { color: var(--worker); } .q.review h3 { color: var(--reviewer); } .q.merge h3 { color: var(--green); }
  .q td.pos { color: var(--muted); font: 500 12px var(--mono); width: 22px; padding-right: 6px; text-align: right; }
  .q tr:first-child td.pos, .q tr:first-child td.id { color: var(--bright); }
  .q tr.sub td { border-top: 0; padding-top: 0; font-size: 12.5px; }


  pre.log { margin: 0; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; max-height: 44vh; overflow: auto; color: var(--ink); }
  pre.log .t { color: var(--muted); }
  pre.log .good { color: var(--green); } pre.log .warn { color: var(--yellow); } pre.log .bad { color: var(--orange); }
  pre.log .pick { color: var(--blue); } pre.log .rev { color: var(--violet); } pre.log .sys { color: var(--muted); }
  .banner { background: rgba(220, 50, 47, .12); border: 1px solid var(--bad); color: var(--bright); padding: 10px 14px; border-radius: 8px; }
  footer { color: var(--muted); font-size: 12px; text-align: right; padding: 0 20px 20px; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>bead-loop</h1>
  <div class="unit" id="timer"></div>
  <div class="unit" id="tick"></div>
  <div class="unit" id="gpu"></div>
  <div class="unit" id="live" style="margin-left:auto"></div>
</header>
<main id="main"><div class="empty">loading…</div></main>
<footer id="foot"></footer>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t, now) => { const d = Math.max(0, now - t); return d < 90 ? `${d}s` : d < 5400 ? `${Math.floor(d / 60)}m` : `${Math.floor(d / 3600)}h${String(Math.floor((d % 3600) / 60)).padStart(2, '0')}`; };
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
// systemd prints "Sat 2026-09-19 03:50:00 UTC"; Date.parse wants the weekday gone.
const systemdTime = (s) => { if (!s) return null; const d = Date.parse(s.replace(/^\w+ /, '')); return Number.isNaN(d) ? null : Math.floor(d / 1000); };

let last = null, busyAction = false;
async function act(name, body, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  busyAction = true; render();
  try {
    const r = await fetch(`/api/${name}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (!r.ok) alert(j.error || r.statusText);
  } catch (e) { alert(e.message); }
  busyAction = false; render();
}
window.act = act;

function gpu(s) {
  const g = s.gpu;
  if (!g || !g.available) { $('gpu').innerHTML = ''; return; }
  const dis = busyAction ? 'disabled' : '';
  // game: the loop and the model server are stopped for the GPU; work: running, and the
  // guard may flip to game by itself when it sees one (then `by` says auto).
  $('gpu').innerHTML = `<span class="dot ${g.mode === 'game' ? 'warn' : 'on'}"></span>GPU ${esc(g.mode)}<span class="muted"> (${esc(g.by)})</span>
    <span class="seg"><button class="${g.mode === 'work' ? 'cur' : ''}" ${dis} onclick="act('gpu',{mode:'work'})">Work</button><button class="${g.mode === 'game' ? 'cur game' : ''}" ${dis} onclick="act('gpu',{mode:'game'},'Game mode: stop the loop (aborting its session) and the local model server?')">Game</button></span>`;
}
function header(s) {
  gpu(s);
  const t = s.timer, v = s.service, dis = busyAction ? 'disabled' : '';
  const ticking = v.available && (v.active === 'active' || v.active === 'activating');
  const next = systemdTime(t.next), since = systemdTime(v.since);
  // OnUnitInactiveSec: the next elapse is only known once the tick has finished.
  const when = next ? `next tick ${clock(next)} (in ${ago(s.now, next)})` : ticking ? `next tick ${t.gap ? t.gap + ' ' : ''}after this one ends` : '';
  $('timer').innerHTML = !t.available ? `<span class="dot"></span><span class="muted">no systemd timer here</span>` : t.active === 'active'
    ? `<span class="dot on"></span>timer running${when ? ` · ${when}` : ''} <button ${dis} onclick="act('timer',{on:false})">Pause timer</button>`
    : `<span class="dot"></span>timer paused <button ${dis} onclick="act('timer',{on:true})">Resume timer</button>`;
  const working = s.repos.flatMap((r) => Object.entries(r.lanes).map(([k, l]) => `${k} ${l.id}`)).join(' · ');
  $('tick').innerHTML = !v.available ? '' : ticking
    ? `<span class="dot busy"></span>tick running${since ? ` ${ago(since, s.now)}` : ''}${working ? ` — ${esc(working)}` : ''} <button class="danger" ${dis} onclick="act('stop',{},'Stop the running tick? The supervisor aborts the model session it is on and the attempt is not recorded.')">Stop tick</button>`
    : `<span class="dot ${v.result && v.result !== 'success' ? 'bad' : ''}"></span>tick idle${v.result && v.result !== 'success' ? ` (last: ${esc(v.result)})` : ''} <button ${dis} onclick="act('tick')">Tick now</button>`;
}

const stateChip = (st) => st === 'busy' ? '<span class="chip busy">busy</span>' : st === 'orphan' ? '<span class="chip bad">orphan</span>' : '<span class="chip">idle</span>';
// The agent as its role: the worker implements, the reviewer judges; colour tells them apart.
const roleChip = (agent) => `<span class="chip ${/review/.test(agent) ? 'reviewer' : 'worker'}">${esc((agent || '?').replace(/^bead-/, ''))}</span>`;
// A session's name: opencode's, unless it is the "????" a busy model has answered with.
const titleOf = (s, w) => (s.title && !/^[\s?.…]*$/.test(s.title)) ? s.title : `${w.id} · ${(s.agent || '').replace(/^bead-/, '')}`;
// How often the bead has been sent back to dev, and the stage that count puts it on:
// stage 1 is the fast local pair; a later stage is a stronger model, the last one Opus.
const failChip = (n) => n ? `<span class="chip n" title="sent back to dev ${n} time${n > 1 ? 's' : ''}">${n}×</span>` : '';
const stageChip = (st) => !st ? '<span class="chip bad" title="stages exhausted">exhausted</span>'
  : `<span class="chip ${st.index > 1 ? 'warn' : ''}" title="stage ${st.index}: worker ${esc(st.worker)}${st.reviewer ? ', reviewer ' + esc(st.reviewer) : ''}">${st.index > 1 ? `S${st.index} · ` : ''}${esc(st.worker)}</span>`;
const count = (n, label) => `<div class="count ${n ? '' : 'zero'}">${n}<small>${label}</small></div>`;
const abortBtn = (r, sess, label) => `<button class="danger" ${busyAction ? 'disabled' : ''} onclick="act('abort',{attach:${JSON.stringify(r.attach)},session:${JSON.stringify(sess.id)}},'Abort ${esc(label)}?')">Abort</button>`;

// A PR in the merge queue: what GitHub says now (p.pr, a minute old at most), then the
// loop's own markers. Merged or closed on GitHub means the next reconcile finishes it.
function prChips(p, now) {
  const g = p.pr, out = [];
  if (g && g.state === 'MERGED') out.push(`<span class="chip ok">merged${g.mergedAt ? ` ${ago(g.mergedAt, now)} ago` : ''}</span> <span class="muted">bead closes on the next tick</span>`);
  else if (g && g.state === 'CLOSED') out.push('<span class="chip warn">closed unmerged</span> <span class="muted">parked on the next tick</span>');
  else if (g) {
    const bad = g.checks.filter((c) => /FAIL|ERROR|CANCEL/i.test(c.state)), pending = g.checks.filter((c) => /PENDING|IN_PROGRESS|QUEUED|EXPECTED/i.test(c.state));
    out.push(bad.length ? `<span class="chip bad">CI red</span> <span class="muted">${esc(bad.map((c) => c.name).join(', '))} · back to dev on the next tick</span>`
      : g.checks.length === 0 ? '<span class="chip">no checks yet</span>'
      : pending.length ? `<span class="chip busy">CI running</span> <span class="muted">${pending.length}/${g.checks.length} pending</span>`
      : '<span class="chip ok">CI green</span> <span class="muted">merges on the next tick</span>');
  } else out.push(p.red ? '<span class="chip bad">CI red</span>' : '<span class="chip">waiting on CI</span>');
  if (p.adopted) out.push('<span class="chip warn" title="opened by someone else, adopted by the loop">adopted</span>');
  return out.join(' ');
}

// The two lanes, side by side: what each is on right now, with the session that is live
// for it and the lever to stop it. This is the page's answer to "what is being worked".
function lanePanel(r, name, now, ticking) {
  const l = r.lanes[name];
  const role = name === 'dev' ? 'worker' : 'reviewer';
  if (!l) {
    const why = name === 'dev'
      ? (r.queues.dev.length === 0 ? 'dev queue empty' : r.queues.merge.filter((p) => !p.adopted).length >= r.max_inflight ? `waiting on CI (${r.max_inflight} in flight is the limit)` : ticking ? 'starting…' : 'until the next tick')
      : (r.queues.review.length === 0 ? 'review queue empty' : ticking ? 'starting…' : 'until the next tick');
    return `<div class="lane idle ${name}"><div class="label">${name} lane</div><div class="what">idle — ${esc(why)}</div></div>`;
  }
  const wt = r.worktrees.find((x) => x.id === l.id);
  const live = wt && wt.sessions.find((s) => s.state === 'busy');
  return `<div class="lane ${name}">
    <div class="label">${name} lane <span class="muted">· ${role} · ${ago(l.since, now)}</span></div>
    <div class="bead">${esc(l.id)}</div>
    <div class="what">${esc(l.title || '')}</div>
    <div class="stage">${failChip(l.failures)}${stageChip(l.stage)}
      ${live ? `${roleChip(live.agent)} <span class="mono">${esc(live.model)}</span> <span>last output ${ago(live.updated, now)} ago</span> <a href="${esc(live.url)}" target="_blank" rel="noopener">open session ↗</a> ${abortBtn(r, live, `${live.agent} on ${l.id}`)}`
        : `<span>${name === 'dev' ? 'setup, or the gate' : 'pushing the PR'}</span>`}</div>
  </div>`;
}
// Sessions the server is still running that are on no lane: an orphan of a killed round,
// or a hand-run `work`. Only appears when there is something to stop.
function strays(r, now) {
  const on = Object.values(r.lanes).map((l) => l.id);
  const rows = r.worktrees.filter((x) => !on.includes(x.id)).flatMap((x) => x.sessions.filter((s) => s.state !== 'idle').map((s) => ({ ...s, wt: x })));
  if (rows.length === 0) return '';
  return `<h3>Also running<span class="n">${rows.length}</span><span class="note">on no lane — an older round, or a hand-run work</span></h3><table>${rows.map((s) => `
    <tr><td class="fit">${stateChip(s.state)}</td><td class="fit">${roleChip(s.agent)}</td><td class="id">${esc(s.wt.id)}</td><td class="mono muted fit">${esc(s.model)}</td>
        <td class="muted fit">${ago(s.updated, now)} ago</td>
        <td class="title"><span class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(titleOf(s, s.wt))} ↗</a></span></td>
        <td class="act">${abortBtn(r, s, `${s.agent} on ${s.wt.id}`)}</td></tr>`).join('')}</table>`;
}

// The queues, in the order the lanes take them. Position is the information: #1 is next.
const qRow = (i, b, extra) => `<tr><td class="pos">${i + 1}</td><td class="id">${esc(b.id)}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td><td class="fit">${failChip(b.failures)}${extra || ''}</td></tr>`;
function queueCol(name, rows, r, now) {
  const empty = { dev: 'nothing ready', review: 'nothing waiting for review', merge: 'no PRs in flight' }[name];
  const sub = { dev: 'fewest failures first, then bd’s order', review: 'gate passed; the reviewer next', merge: `PRs in CI · dev pauses at ${r.max_inflight}` }[name];
  let body;
  if (rows.length === 0) body = `<div class="empty">${empty}</div>`;
  else if (name === 'merge') body = `<table>${rows.map((p) => `<tr><td class="id">${esc(p.id)}</td><td class="title"><span class="t"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\/github\.com\/[^/]+\//, ''))} ↗</a></span></td></tr><tr class="sub"><td></td><td>${prChips(p, now)}</td></tr>`).join('')}</table>`;
  else body = `<table>${rows.map((b, i) => qRow(i, b, name === 'dev' ? ` ${stageChip(b.stage)}` : ` <span class="muted">${ago(b.since, now)}</span>`)).join('')}</table>`;
  return `<div class="q ${name}"><h3>${name} queue<span class="n">${rows.length}</span></h3><div class="sub">${sub}</div>${body}</div>`;
}

function repo(r, now, ticking) {
  const stages = r.stages.map((s, i) => `<span title="stage ${i + 1}: takes the next ${s.failures} failure${s.failures > 1 ? 's' : ''}"><span class="mono">${esc(s.worker)}</span>${s.reviewer ? ` ⇢ <span class="mono">${esc(s.reviewer)}</span>` : ''} ×${s.failures}</span>`).join(' &nbsp;→&nbsp; ');
  const parked = r.parked.length === 0 ? '<div class="empty">none</div>' : `<table>${r.parked.map((b) => `<tr><td class="id">${esc(b.id)}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td><td class="fit">${failChip(b.failures)}${b.stage ? '' : ' <span class="chip bad">exhausted</span>'}</td>
    <td class="act"><button ${busyAction ? 'disabled' : ''} onclick="act('reopen',{repo:${JSON.stringify(r.repo)},id:${JSON.stringify(b.id)}})">Reopen</button></td></tr>`).join('')}</table>`;
  return `<section class="card" id="repo-${esc(r.slug)}">
    <h2>${esc(r.slug)} <span class="cfg">${esc(r.label)} · ${esc(r.base)} · merge ${esc(r.merge)} · stages: ${stages} · then ${esc(r.on_exhaust)}${r.attach ? '' : ' · <b>no attach</b>: sessions not visible'}</span></h2>
    <div class="lanes">${lanePanel(r, 'dev', now, ticking)}${lanePanel(r, 'review', now, ticking)}</div>
    <div class="queues">${queueCol('dev', r.queues.dev, r, now)}${queueCol('review', r.queues.review, r, now)}${queueCol('merge', r.queues.merge, r, now)}</div>
    ${strays(r, now)}
    <h3>Parked<span class="n">${r.parked.length}</span><span class="note">in_progress, waiting for you — stages exhausted, BLOCKED at the last stage, or a PR closed unmerged</span></h3>${parked}
  </section>`;
}

// One class per kind of line, so the eye can skim the log for the red and the green.
function logClass(m) {
  if (/stopped:|failed|BLOCKED|CI red|rejected|exhausted|parked/.test(m)) return 'bad';
  if (/approved|opened https|pushed a new round|closed \(|merged/.test(m)) return 'good';
  if (/review: |→ review queue/.test(m)) return 'rev';
  if (/dev: bead |→ dev queue/.test(m)) return 'pick';
  if (/^(Starting|Finished|Stopped|Started) |\.service:/.test(m)) return 'sys';
  return '';
}

function render() {
  if (!last) return;
  header(last);
  const log = last.log.length === 0 ? '<div class="empty">no journal (not running under systemd?)</div>'
    : `<pre class="log" id="log">${last.log.map((l) => { const m = l.msg.replace(/^\d\d:\d\d:\d\d /, ""); return `<span class="t">${clock(l.t)}</span>  <span class="${logClass(m)}">${esc(m)}</span>`; }).join("\n")}</pre>`;
  $('main').innerHTML = (last.error ? `<div class="banner">status failed: ${esc(last.error)}</div>` : '')
    + (last.repos.length === 0 ? '<section class="card"><div class="empty">no repos: set <span class="mono">repos</span> in ~/.config/bead-loop/config.toml</div></section>' : '')
    + last.repos.map((r) => repo(r, last.now, last.service.available && (last.service.active === 'active' || last.service.active === 'activating'))).join("")
    + `<section class="card"><h3>Supervisor log</h3>${log}</section>`;
  const el = $('log'); if (el) el.scrollTop = el.scrollHeight;
  $('foot').textContent = `state as of ${clock(last.now)} · pushed on every change`;
}
// Pushed, not polled: the server sends the whole state whenever anything in it changes.
// EventSource reconnects by itself; the dot says which.
// A hidden tab drops its stream and picks it up again when shown: a browser allows six
// connections to one host, and a forgotten tab holding one is how the seventh "hangs".
// It also means an unwatched page costs the server nothing.
let live = false, es = null;
function setLive(on, text) { live = on; $('live').innerHTML = on ? '<span class="dot on"></span><span class="muted">live</span>' : `<span class="dot ${text === 'paused' ? '' : 'bad'}"></span><span class="muted">${text || 'reconnecting…'}</span>`; }
function connect() {
  if (es) return;
  setLive(false, 'connecting…');
  es = new EventSource('/api/events');
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (m) => { last = JSON.parse(m.data); render(); };
}
function disconnect() { if (es) { es.close(); es = null; } setLive(false, 'paused'); }
document.addEventListener('visibilitychange', () => (document.hidden ? disconnect() : connect()));
connect();
// Between pushes the clock still moves: re-render the ages every 10 s from the last state.
setInterval(() => { if (last && live) { last.now = Math.floor(Date.now() / 1000); render(); } }, 10000);
</script>
</body>
</html>
