<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bead-loop</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  /* Solarized dark (Ethan Schoonover), the whole page. The 16 names are kept so a
     colour choice reads as the palette's own: base03 canvas, base02 panels, base01
     for what can be dim, base0 for text, base1 for what must be read first. */
  :root {
    --base03: #002b36; --base02: #073642; --base01: #586e75; --base00: #657b83;
    --base0: #839496; --base1: #93a1a1; --base2: #eee8d5; --base3: #fdf6e3;
    --yellow: #b58900; --orange: #cb4b16; --red: #dc322f; --magenta: #d33682;
    --violet: #6c71c4; --blue: #268bd2; --cyan: #2aa198; --green: #859900;
    --bg: var(--base03); --panel: var(--base02); --ink: var(--base0); --bright: var(--base1); --muted: var(--base01);
    --line: rgba(147, 161, 161, .14); --line-strong: rgba(147, 161, 161, .28);
    --accent: var(--blue); --ok: var(--green); --warn: var(--yellow); --bad: var(--red); --busy: var(--cyan);
    --worker: var(--cyan); --reviewer: var(--violet);
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --quick: .15s ease-out;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; scrollbar-color: var(--base01) transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  b, strong { color: var(--bright); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* header: one bar, the units separated by rules */
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line-strong);
           padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px 0; align-items: center; }
  header h1 { font-size: 15px; margin: 0 20px 0 0; letter-spacing: .04em; color: var(--base2); font-weight: 600; }
  .unit { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 18px; border-left: 1px solid var(--line-strong); color: var(--bright); }
  .unit:empty { display: none; }
  .unit .muted { color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--base01); display: inline-block; flex: none; transition: background-color var(--quick); }
  .dot.on { background: var(--ok); } .dot.warn { background: var(--orange); } .dot.bad { background: var(--bad); }
  .dot.busy { background: var(--busy); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 5px; border: 1px solid var(--line-strong);
           background: transparent; color: var(--bright); cursor: pointer; line-height: 1.3; position: relative;
           transition: border-color var(--quick), color var(--quick), background-color var(--quick), opacity var(--quick); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { border-color: var(--line-strong); color: var(--bright); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--base03); font-weight: 600; }
  button.primary:hover { background: #3a9be0; border-color: #3a9be0; color: var(--base03); }
  /* the lever that is pulling now: its label gives way to a spinner, in place */
  button.busy, button.busy:disabled { color: transparent; opacity: 1; }
  button.busy::after { content: ''; position: absolute; inset: 0; margin: auto; width: 12px; height: 12px; border-radius: 50%;
                       border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  button.primary.busy::after { border-color: rgba(0, 43, 54, .35); border-top-color: var(--base03); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; } .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.cur, .seg button.cur:hover { background: var(--accent); color: var(--base03); }
  .seg button.cur.game { background: var(--orange); }
  /* a lever that asks first: the button gives way to its question and a yes, in place;
     Escape or Cancel puts the button back */
  .confirm { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 3px 4px 3px 10px; border-radius: 6px;
             border: 1px solid var(--yellow); background: rgba(181, 137, 0, .1); color: var(--base2); font-size: 13px;
             white-space: normal; text-align: left; vertical-align: middle; animation: rise var(--quick); }
  .confirm .q { max-width: 52ch; line-height: 1.35; }
  .confirm .yes { background: var(--yellow); border-color: var(--yellow); color: var(--base03); font-weight: 600; }
  .confirm .yes:hover { background: #c99a0a; border-color: #c99a0a; color: var(--base03); }
  .confirm .yes.danger { background: var(--bad); border-color: var(--bad); color: var(--base3); }
  .confirm .yes.danger:hover { background: #e8433f; border-color: #e8433f; color: var(--base3); }
  .confirm .no { border-color: transparent; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } }
  /* what a lever said, at the bottom right for a moment: an error stays longer */
  #toasts { position: fixed; right: 16px; bottom: 16px; z-index: 5; display: grid; gap: 8px; max-width: min(440px, calc(100vw - 32px)); }
  .toast { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px 9px 12px; border-radius: 8px; background: var(--panel);
           border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); color: var(--base2); font-size: 13px; line-height: 1.4;
           box-shadow: 0 8px 24px rgba(0, 0, 0, .35); animation: rise .18s ease-out; }
  .toast.ok { border-left-color: var(--ok); } .toast.bad { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--yellow); }
  .toast .x { margin-left: auto; border: 0; padding: 0 4px; color: var(--muted); font-size: 16px; line-height: 1; flex: none; }
  .toast .x:hover { color: var(--bright); }

  main { padding: 20px; max-width: 1400px; margin: 0 auto; display: grid; gap: 18px; transition: opacity .4s; }
  body.stale main { opacity: .55; }  /* the stream is down: what is shown is as of the footer's time */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
  .card h2 { margin: 0; font-size: 17px; color: var(--base2); font-weight: 600; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card h3 { margin: 18px 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .card h3:first-child { margin-top: 0; }
  .card h3 .n { color: var(--bright); margin-left: 4px; }
  .card h3 .note { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .cfg { color: var(--muted); font-size: 13px; font-weight: 400; }
  .cfg .mono { color: var(--base00); }

  .chip { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 11.5px; line-height: 18px; font-weight: 600;
          letter-spacing: .02em; color: var(--base1); background: rgba(147, 161, 161, .12); vertical-align: 1px; white-space: nowrap; }
  .chip.ok { color: var(--base03); background: var(--ok); } .chip.warn { color: var(--base03); background: var(--warn); }
  .chip.bad { color: var(--base3); background: var(--bad); } .chip.busy { color: var(--base03); background: var(--busy); }
  .chip.worker { color: var(--worker); background: rgba(42, 161, 152, .14); }
  .chip.reviewer { color: var(--reviewer); background: rgba(108, 113, 196, .18); }
  .chip.n { min-width: 22px; text-align: center; color: var(--bright); }
  /* a bead's round history: the toggle sits by the failures chip; the list is quiet, monospace */
  button.hist { font: 500 12px var(--mono); padding: 0 5px; border: 0; color: var(--muted); line-height: 18px; vertical-align: 1px; white-space: nowrap; }
  button.hist:hover, button.hist.on { color: var(--accent); }
  pre.hist { margin: 2px 0 8px; font: 12px/1.55 var(--mono); color: var(--muted); white-space: pre-wrap; }
  tr.sub td { border-top: 0; padding-top: 0; } tr.sub td pre.hist { margin-top: 0; }
  /* the rounds: one block each — who, when, what stopped it in full, and its logs to open in place */
  .rounds { margin: 2px 0 8px; display: grid; gap: 8px; max-width: 900px; animation: rise var(--quick); }
  .round { border-left: 2px solid var(--line-strong); padding: 2px 0 2px 10px; }
  .round .head { font: 500 12px var(--mono); color: var(--bright); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .round .head .muted { font-weight: 400; }
  .round pre.note { margin: 3px 0 4px; font: 12px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; }
  .round .logs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  button.link { font: 500 12px var(--mono); padding: 0 6px; border-color: var(--line); color: var(--muted); line-height: 18px; }
  button.link:hover, button.link.on { color: var(--accent); border-color: var(--accent); }
  pre.logview { margin: 4px 0 2px; font: 11.5px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; max-height: 40vh; overflow: auto;
                background: var(--base03); padding: 8px 10px; border-radius: 6px; scrollbar-width: thin; animation: rise var(--quick); }
  pre.logview .t { color: var(--muted); } pre.logview .tool { color: var(--blue); } pre.logview .said { color: var(--base1); }
  /* the question a parked bead stops on: the one thing on the page that is yours to answer */
  .ask { border-left: 3px solid var(--yellow); padding: 6px 12px; margin: 4px 0 8px; background: rgba(181, 137, 0, .07); border-radius: 0 6px 6px 0; max-width: 900px; }
  .ask .head { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--yellow); font-weight: 600; }
  .ask .head .muted { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  .ask pre.text { margin: 4px 0 2px; color: var(--base2); font-size: 13px; }
  .fold { margin: 2px 0; } .fold > pre { animation: rise var(--quick); }

  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 7px 12px 7px 0; vertical-align: top; border-top: 1px solid var(--line); }
  td:last-child, th:last-child { padding-right: 0; }
  tr:first-child td { border-top: 0; }
  th { border-top: 0; padding-top: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .id, .mono { font-family: var(--mono); font-size: 13px; }
  td.id { color: var(--accent); white-space: nowrap; }
  .muted { color: var(--muted); }
  td.act { text-align: right; white-space: nowrap; }
  td.act .confirm { white-space: normal; }
  td.title { color: var(--ink); max-width: 0; width: 100%; }
  td.title .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.fit { white-space: nowrap; }

  /* the two lanes: what each is on right now, readable from across the room */
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 800px) { .lanes { grid-template-columns: 1fr; } }
  .lane { padding: 14px 18px; border-radius: 8px; background: var(--base03); border-left: 4px solid var(--worker); min-height: 96px; transition: border-color .3s; }
  .lane.review { border-left-color: var(--reviewer); }
  .lane.idle { border-left-color: var(--base01); }
  .lane .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .lane .label .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .lane .label { display: flex; align-items: center; gap: 8px; } .lane .label .act { margin-left: auto; }
  .lane.paused { border-left-style: dashed; }
  .lane .bead { font: 600 26px/1.15 var(--mono); color: var(--accent); margin-top: 6px; }
  .lane .what { font-size: 15px; color: var(--base2); margin-top: 3px; line-height: 1.4; }
  .lane.idle .what { color: var(--muted); font-style: italic; margin-top: 10px; }
  .lane .stage { margin-top: 10px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* the three queues, in the order the lanes take them, then the Claude column: a view over them */
  .queues { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 0 28px; margin-top: 6px; }
  @media (max-width: 1000px) { .queues { grid-template-columns: 1fr; } }
  .q h3 { margin-bottom: 2px; } .q .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .q.dev h3 { color: var(--worker); } .q.review h3 { color: var(--reviewer); } .q.merge h3 { color: var(--green); } .q.claude h3 { color: var(--blue); }
  .q td.pos { color: var(--muted); font: 500 12px var(--mono); width: 22px; padding-right: 6px; text-align: right; }
  .q tr:first-child td.pos, .q tr:first-child td.id { color: var(--bright); }
  .q tr.sub td { border-top: 0; padding-top: 0; font-size: 12.5px; }
  tr.sub td.why { border-top: 0; padding-top: 0; padding-bottom: 10px; font-size: 13px; color: var(--ink); white-space: normal; line-height: 1.5; max-width: 900px; }
  tr.sub td.why code { font-size: 12px; }
  h3.human { color: var(--yellow); }
  /* the box you write in: full width, grows with the text, keeps what you typed across
     every push (the page is patched, not rebuilt) and across a reload (a draft per box) */
  .reply { display: grid; gap: 8px; margin-top: 8px; max-width: 900px; animation: rise var(--quick); }
  .reply textarea, .reply input[type=text] { width: 100%; font: 13px/1.45 var(--sans); padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 6px;
                    background: var(--base03); color: var(--bright); resize: vertical; field-sizing: content; min-height: calc(2 * 1.45em + 16px); max-height: 40vh;
                    transition: border-color var(--quick); }
  .reply input[type=text] { min-height: 0; }
  .reply textarea:focus, .reply input[type=text]:focus { border-color: var(--accent); outline: none; }
  .reply textarea::placeholder { color: var(--base01); }
  .reply .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reply .actions .alt { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
  .reply .hint { color: var(--muted); font-size: 12px; }
  .reply code.cmd { font: 12px var(--mono); color: var(--bright); background: var(--base03); padding: 3px 7px; border-radius: 4px; user-select: all; }


  /* the scoreboard: a row of tiles, the one number each in the bright ink, its reading
     under it; below, three columns — where rounds go back (bars in one hue, the count
     beside each), what each model landed and lost, and the model cost. */
  #score h2 .seg { margin-left: auto; font-size: 12.5px; }
  #score h2 .seg button { padding: 2px 10px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 14px; }
  .tile { padding: 12px 14px; border-radius: 8px; background: var(--base03); }
  .tile .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .tile .value { font-size: 30px; line-height: 1.15; font-weight: 600; color: var(--base2); margin-top: 4px; }
  .tile .value small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .tile .value.warn { color: var(--yellow); }
  .tile .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .score-cols { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 0 28px; margin-top: 4px; }
  @media (max-width: 1000px) { .score-cols { grid-template-columns: 1fr; } }
  .bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 5px 10px; align-items: center; font-size: 13px; }
  .bars .k { color: var(--ink); white-space: nowrap; } .bars .n { color: var(--bright); font: 500 12.5px var(--mono); text-align: right; }
  .bars .bar { height: 10px; border-radius: 3px; background: rgba(38, 139, 210, .18); overflow: hidden; }
  .bars .bar i { display: block; height: 100%; background: var(--blue); border-radius: 3px; transition: width .4s; }
  .score-cols .note { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  td.num { text-align: right; font: 500 13px var(--mono); white-space: nowrap; color: var(--bright); }
  th.num { text-align: right; white-space: nowrap; }
  td.reasons { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .chip.hand { color: var(--base03); background: var(--base1); }

  /* the log's heading carries its one option, at the right */
  .card h3.log { display: flex; align-items: center; }
  .card h3.log .opt { margin-left: auto; display: flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; cursor: pointer; }
  .card h3.log .opt input { margin: 0; accent-color: var(--accent); }
  pre.log { margin: 0; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; max-height: 44vh; overflow: auto; color: var(--ink); scrollbar-width: thin; }
  pre.log .t { color: var(--muted); }
  pre.log .good { color: var(--green); } pre.log .warn { color: var(--yellow); } pre.log .bad { color: var(--orange); }
  pre.log .pick { color: var(--blue); } pre.log .rev { color: var(--violet); } pre.log .sys { color: var(--muted); }
  .banner { background: rgba(220, 50, 47, .12); border: 1px solid var(--bad); color: var(--bright); padding: 10px 14px; border-radius: 8px; }
  .banner.signin { margin: 16px 20px 0; background: rgba(181, 137, 0, .12); border-color: var(--warn); animation: rise var(--quick); }
  .banner.signin ol { margin: 6px 0 0; padding-left: 22px; } .banner.signin li { margin: 4px 0; }
  .banner.signin input { font: 13px var(--mono); padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--base03); color: var(--bright); }
  h2 .prio { font-size: 12px; font-weight: 400; margin-left: 8px; vertical-align: middle; }
  h2 .prio.on { color: var(--yellow); border-color: var(--yellow); }
  .why pre.text { margin: 4px 0 8px; white-space: pre-wrap; font: 12.5px/1.55 var(--mono); color: var(--ink); }
  footer { color: var(--muted); font-size: 12px; text-align: right; padding: 0 20px 20px; }
  .empty { color: var(--muted); font-style: italic; }
  main > .empty { text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>bead-loop</h1>
  <div class="unit" id="timer"></div>
  <div class="unit" id="tick"></div>
  <div class="unit" id="gpu"></div>
  <div class="unit" id="claude"></div>
  <div class="unit" id="live" style="margin-left:auto"></div>
</header>
<div id="doctor" class="banner" hidden></div>
<div id="signin" class="banner signin" hidden></div>
<main id="main"><div class="empty">loading…</div></main>
<footer id="foot"></footer>
<div id="toasts"></div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
// js(v): a JavaScript literal for use inside an onclick="…" attribute: JSON, then the
// quotes HTML-escaped, so the attribute is not cut short at the first inner ".
const js = (v) => esc(JSON.stringify(v));
// lit(o): an object literal for the same place, the keys bare — {repo:"…",id:"…"}.
const lit = (o) => `{${Object.entries(o || {}).map(([k, v]) => `${k}:${js(v)}`).join(',')}}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t, now) => { const d = Math.max(0, now - t); return d < 90 ? `${d}s` : d < 5400 ? `${Math.floor(d / 60)}m` : `${Math.floor(d / 3600)}h${String(Math.floor((d % 3600) / 60)).padStart(2, '0')}`; };
// merge = "external": awaiting the maintainer, counted in days (hours under a day) —
// their queue, not ours to nag about in minutes.
const awaiting = (since, now) => { const d = Math.max(0, now - since); return d < 86400 ? `${Math.floor(d / 3600)} h` : `${Math.floor(d / 86400)} days`; };
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
// systemd prints "Sat 2026-09-19 03:50:00 UTC"; Date.parse wants the weekday gone.
const systemdTime = (s) => { if (!s) return null; const d = Date.parse(s.replace(/^\w+ /, '')); return Number.isNaN(d) ? null : Math.floor(d / 1000); };

// ---- the DOM: patched, never replaced ---------------------------------------------------
// Every render writes the page as one string — simple to write, simple to test — but the
// browser is not told to throw the old tree away: the string is parsed off-screen and
// the live tree patched to match it, node by node. What the string does not describe
// stays as it was: the text in a box you are typing in and the cursor in it, a hover, a
// button waiting on your yes, how far down a log you have read. Children match by their
// data-key or id when they carry one (a row for a bead, a lane, a toast), else by tag and
// position. A textarea's or input's value is yours, never the markup's. Under the test
// stub there is no DOM, and the string is the element's innerHTML.
function patch(el, html) {
  if (typeof document.createElement !== 'function') { el.innerHTML = html; return; }
  const t = document.createElement('template'); t.innerHTML = html;
  morphChildren(el, t.content);
}
const keyOf = (n) => n.nodeType === 1 ? (n.getAttribute('data-key') || n.id || '') : '';

  else if (g && g.state === 'CLOSED') out.push('<span class="chip warn">closed unmerged</span> <span class="muted">parked on the watcher\'s next look</span>');
  else if (g && g.mergeable === 'CONFLICTING' && !p.adopted) out.push(`<span class="chip warn">conflicts with base</span> <span class="muted">back to dev on the watcher's next look for a rebase by ${esc(r.conflict_worker || (lastStage(r) ? lastStage(r).worker : 'the last stage'))}</span>`);
  else if (g && g.mergeable === 'CONFLICTING') out.push('<span class="chip warn">conflicts with base</span> <span class="muted">adopted: whoever opened it rebases</span>');
  else if (g) {
    const bad = g.checks.filter((c) => /FAIL|ERROR|CANCEL/i.test(c.state)), pending = g.checks.filter((c) => /PENDING|IN_PROGRESS|QUEUED|EXPECTED/i.test(c.state));
    out.push(bad.length ? `<span class="chip bad">CI red</span> <span class="muted">${esc(bad.map((c) => c.name).join(', '))} · back to dev on the watcher's next look</span>`
      : p.merge_mode === 'external' ? `<span class="chip">awaiting the maintainer, ${awaiting(p.awaiting_since, now)}</span>`
      : g.checks.length === 0 ? '<span class="chip">no checks yet</span>'
      : pending.length ? `<span class="chip busy">CI running</span> <span class="muted">${pending.length}/${g.checks.length} pending</span>`
      : `<span class="chip ok">CI green</span> <span class="muted">${r.merge === 'auto' ? 'merges on the watcher\'s next look' : r.merge === 'pipeline' ? 'the pipeline merges it' : 'yours to merge'}</span>`);
  } else out.push(p.red ? '<span class="chip bad">CI red</span>' : p.merge_mode === 'external' ? `<span class="chip">awaiting the maintainer, ${awaiting(p.awaiting_since, now)}</span>` : '<span class="chip">waiting on CI</span>');
  if (p.adopted) out.push('<span class="chip warn" title="opened by someone else, adopted by the loop">adopted</span>');
  if (p.held) out.push(`<span class="chip warn" title="${esc(p.held.why)}">held · ${esc(p.held.why.slice(0, 80))}</span>`);
  return out.join(' ');
}

// The two lanes, side by side: what each is on right now, with the session that is live
// for it and the lever to stop it. This is the page's answer to "what is being worked".
function lanePanel(r, name, now, ticking, showRepo) {
  // A slot of a wide lane (claude.2) is its lane under another name: the lane's role,
  // the lane's pause flag.
  const lane = laneOf(name);
  const l = r.lanes[name];
  // The lane's role: the default pair split by role; a configured lane ([[lanes]]) or
  // the claude lane takes both roles for its models.
  const role = lane === 'dev' ? 'worker' : lane === 'review' ? 'reviewer' : lane === 'claude' ? 'worker or reviewer · Anthropic, waits on no local model' : 'worker or reviewer · its models’ rounds';
  const paused = r.paused && r.paused[name];
  const pauseBtn = lever(paused ? 'Resume lane' : 'Pause lane', 'lane', { name: lane, paused: !paused });
  if (!l) {
    const capped = r.max_inflight != null && r.queues.merge.filter((p) => !p.adopted).length >= r.max_inflight;
    const heldOnly = (q) => q.length > 0 && q.every((b) => b.held);
    const onClaude = (b) => b.stage && /^claude\//.test(b.stage.worker + ' ' + (b.stage.reviewer || ''));
    const claudeQueued = r.queues.dev.filter(onClaude).length + r.queues.review.filter(onClaude).length;
    const why = lane === 'dev'
      ? (r.queues.dev.length === 0 ? 'dev queue empty' : capped ? `waiting on CI (${r.max_inflight} in flight is the limit)` : heldOnly(r.queues.dev) ? 'every bead in the queue is held — see Needs you' : r.queues.dev.every(onClaude) ? 'only Claude-stage beads queued — the Claude lane has them' : ticking ? 'starting…' : 'the loop is down')
      : lane === 'claude'
      ? (claudeQueued === 0 ? 'nothing on the Claude stage' : r.claude_ok === false ? `${claudeQueued} waiting — Claude is signed out (Sign in at the top)` : ticking ? 'starting…' : 'the loop is down')
      : lane !== 'review'
      ? (ticking ? 'nothing queued for its models' : 'the loop is down')
      : (r.queues.review.length === 0 ? 'review queue empty' : heldOnly(r.queues.review) ? 'every bead in the queue is held — see Needs you' : ticking ? 'starting…' : 'the loop is down');
    return `<div class="lane idle ${name}${paused ? ' paused' : ''}" data-key="${esc(name)}"><div class="label">${name} lane ${paused ? '<span class="chip warn">paused</span>' : ''}<span class="act">${pauseBtn}</span></div><div class="what">${paused ? 'paused — starts no new round until resumed' : `idle — ${esc(why)}`}</div></div>`;
  }
  const wt = r.worktrees.find((x) => x.id === l.id);
  // 'rejoin' counts as live too: the lane is on this bead and waiting on the session a
  // restart found running (no client to show as 'busy' — the loop is polling it), so it
  // gets the same open-session link instead of the generic "setup, or the gate" line.
  const live = wt && wt.sessions.find((s) => s.state === 'busy' || s.state === 'rejoin');
  return `<div class="lane ${name}" data-key="${esc(name)}">
    <div class="label">${name} lane <span class="muted">· ${l.role === 'research' ? 'research: reading for the brief' : role} · ${ago(l.since, now)}</span> ${paused ? '<span class="chip warn" title="finishes this round, then starts no new one">pausing</span>' : ''}<span class="act">${pauseBtn}</span></div>
    <div class="bead">${esc(l.id)}${showRepo ? ` <span class="muted">· ${esc(r.slug)}</span>` : ''}</div>
    <div class="what">${esc(l.title || '')}</div>
    <div class="stage">${failChip(l.failures)}${histToggle(l)}${stageChip(l.stage, r)}
      ${live ? `${roleChip(live.agent)} <span class="mono">${esc(live.model)}</span> <span>last output ${ago(live.updated, now)} ago</span> <a href="${esc(live.url)}" target="_blank" rel="noopener">open session ↗</a> ${abortBtn(r, live, `${live.agent} on ${l.id}`)}`
        : `<span>${l.role === 'research' ? 'making the worktree' : name === 'dev' ? 'setup, or the gate' : 'pushing the PR'}</span>`}</div>${histList(l, r)}
  </div>`;
}
// The lanes, once, at the top: a lane is one thing for the whole loop (it walks every
// repo), so its panel says which bead it is on and which repo that bead belongs to —
// not a set of panels per repo, most of them idle. Idle panels count what is queued
// across repos; paused is paused everywhere.
// The lane a slot belongs to: NAME.K is slot K of NAME (config.rs LaneSpec::slots).
function laneOf(name) { return name.replace(/\.\d+$/, ''); }
function lanesPane(s) {
  const ticking = s.service.available && (s.service.active === 'active' || s.service.active === 'activating');
  const names = [...new Set(s.repos.flatMap((r) => r.lane_names || ['dev', 'review']))];
  const panels = names.map((name) => {
    const on = s.repos.find((r) => r.lanes && r.lanes[name]);
    if (on) return lanePanel(on, name, s.now, ticking, true);
    const lane = laneOf(name);
    const paused = s.repos.some((r) => r.paused && r.paused[name]);
    const pauseBtn = lever(paused ? 'Resume lane' : 'Pause lane', 'lane', { name: lane, paused: !paused });
    const onClaude = (b) => b.stage && /^claude\//.test(b.stage.worker + ' ' + (b.stage.reviewer || ''));
    const count = (pick) => s.repos.reduce((n, r) => n + r.queues.dev.filter(pick).length + r.queues.review.filter(pick).length, 0);
    const queued = lane === 'dev' ? s.repos.reduce((n, r) => n + r.queues.dev.length, 0)
      : lane === 'review' ? s.repos.reduce((n, r) => n + r.queues.review.length, 0)
      : lane === 'claude' ? count(onClaude) : count(() => true);
    const signedOut = lane === 'claude' && s.repos.some((r) => r.claude_ok === false);
    const why = paused ? 'paused — starts no new round until resumed'
      : queued === 0 ? 'idle — nothing queued for it in any repo'
      : signedOut ? `idle — ${queued} waiting; Claude is signed out (Sign in at the top)`
      : ticking ? `idle — ${queued} queued across repos, starting…` : `idle — ${queued} queued; the loop is down`;
    return `<div class="lane idle ${esc(name)}${paused ? ' paused' : ''}" data-key="${esc(name)}"><div class="label">${esc(name)} lane ${paused ? '<span class="chip warn">paused</span>' : ''}<span class="act">${pauseBtn}</span></div><div class="what">${why}</div></div>`;
  });
  return `<section class="card" id="lanes"><h2>Lanes <span class="cfg">one each for the whole loop · a bead names its repo</span></h2><div class="lanes">${panels.join('')}</div></section>`;
}
// Sessions the server is still running that are on no lane yet: a 'rejoin' the last
// restart found and a lane has not picked up its bead for, a real 'orphan' (a killed
// round nothing is coming back for), or a hand-run `work`. Only appears when there is
// something to stop.
function strays(r, now) {
  const on = Object.values(r.lanes).map((l) => l.id);
  const rows = r.worktrees.filter((x) => !on.includes(x.id)).flatMap((x) => x.sessions.filter((s) => s.state !== 'idle').map((s) => ({ ...s, wt: x })));
  if (rows.length === 0) return '';
  return `<h3>Also running<span class="n">${rows.length}</span><span class="note">on no lane — a pending rejoin, an older round, or a hand-run work</span></h3><table>${rows.map((s) => `
    <tr data-key="${esc(s.id)}"><td class="fit">${stateChip(s.state)}</td><td class="fit">${roleChip(s.agent)}</td><td class="id">${esc(s.wt.id)}</td><td class="mono muted fit">${esc(s.model)}</td>
        <td class="muted fit">${ago(s.updated, now)} ago</td>
        <td class="title"><span class="t"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(titleOf(s, s.wt))} ↗</a></span></td>
        <td class="act">${abortBtn(r, s, `${s.agent} on ${s.wt.id}`)}</td></tr>`).join('')}</table>`;
}

// The queues, in the order the lanes take them. Position is the information: #1 is next.
// Rows carry the bead's id as their key, so a bead that moves up a place keeps its open
// history, its note box and what is typed in it.
const qRow = (i, b, extra, r) => `<tr data-key="${esc(b.id)}"><td class="pos">${i + 1}</td><td class="id">${esc(b.id)}${b.target ? ` <span class="muted">[${esc(b.target)}]</span>` : ''}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td><td class="fit">${failChip(b.failures)}${histToggle(b)}${noteToggle(b)}${extra || ''}</td></tr>${histRow(b, 4, r)}${noteRow(b, 4, r)}`;
function queueCol(name, rows, r, now) {
  const empty = { dev: 'nothing ready', review: 'nothing waiting for review', merge: 'no PRs in flight' }[name];
  const sub = { dev: 'no open blocker, fewest failures first, then bd’s order', review: 'gate passed; the reviewer next', merge: r.max_inflight == null ? 'PRs in CI · no cap: dependencies are the gate' : `PRs in CI · dev pauses at ${r.max_inflight}` }[name];
  let body;
  if (rows.length === 0) body = `<div class="empty">${empty}</div>`;
  else if (name === 'merge') body = `<table>${rows.map((p) => `<tr data-key="${esc(p.id)}"><td class="id">${esc(p.id)}${p.target ? ` <span class="muted">[${esc(p.target)}]</span>` : ''}</td><td class="title"><span class="t"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\/github\.com\/[^/]+\//, ''))} ↗</a></span></td></tr><tr class="sub" data-key="${esc(p.id)}:pr"><td></td><td>${prChips(p, now, r)}</td></tr>`).join('')}</table>`;
  else body = `<table>${rows.map((b, i) => qRow(i, b, (name === 'dev' ? ` ${stageChip(b.stage, r)}${researchChip(b)}` : ` <span class="muted">${ago(b.since, now)}</span>${stageChip(b.stage, r).includes('waits for') ? ' <span class="chip bad">waits for Claude sign-in</span>' : ''}`) + `</td><td class="act">${claudeBtn(r, b)}`, r)).join('')}</table>`;
  return `<div class="q ${name}"><h3>${name} queue<span class="n">${rows.length}</span></h3><div class="sub">${sub}</div>${body}</div>`;
}
// The Claude column: every bead whose current stage names a claude/* worker or reviewer,
// and where it sits. A view over the lanes and the dev and review queues, not a queue of
// its own — the last stage is Claude's, and this is where its beads are found. What is
// being worked comes first, then the queues in the order the lanes take them.
const onClaude = (b) => !!(b.stage && /^claude\//.test(b.stage.worker + ' ' + (b.stage.reviewer || '')));
function claudeCol(r) {
  const rows = [
    ...Object.entries(r.lanes).map(([k, l]) => ({ b: l, where: `on the ${k} lane` })),
    ...r.queues.dev.map((b, i) => ({ b, where: `dev queue #${i + 1}` })),
    ...r.queues.review.map((b, i) => ({ b, where: `review queue #${i + 1}` })),
  ].filter((x) => onClaude(x.b));
  const body = rows.length === 0 ? '<div class="empty">no bead on the Claude stage</div>'
    : `<table>${rows.map(({ b, where }) => `<tr data-key="${esc(b.id)}"><td class="id">${esc(b.id)}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td><td class="fit">${failChip(b.failures)}${histToggle(b)} <span class="muted">${esc(where)}</span></td></tr>${histRow(b, 2, r)}`).join('')}</table>`;
  return `<div class="q claude"><h3>Claude<span class="n">${rows.length}</span></h3><div class="sub">the last stage; runs on the dev and review lanes</div>${body}</div>`;
}

// The scoreboard: how well the workflow works, over a window you pick — 24h, 7d, 30d or
// all. The server computes it (`bead-supervisor --json stats`) from what the beads and
// the session logs already record, once a minute. Six tiles answer the questions in
// order: is work landing, how much of it first time, how much without Claude, at what
// cost in rounds and dollars, and how often it needed you. Under them: where rounds go
// back, what each model landed and lost, the model cost — and the last beads finished.
let scoreWin = '7d';
try { scoreWin = localStorage.getItem('scoreWin') || '7d'; } catch { /* the default, every load */ }
window.setWin = (w) => { scoreWin = w; try { localStorage.setItem('scoreWin', w); } catch { /* not remembered, still applied */ } render(); };
let scoreAll = false;  // the finished list shows a few; the toggle opens it for the session
window.setScoreAll = (on) => { scoreAll = !!on; render(); };
const FINISHED_SHOWN = 8;
const dur = (s) => { if (s == null) return '–'; const m = Math.round(s / 60); return m < 60 ? `${m}m` : m < 60 * 48 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : `${(m / 1440).toFixed(1)}d`; };
const hours = (s) => `${(s / 3600).toFixed(1)}h`;
const usd = (n) => `$${n.toFixed(2)}`;
const pct = (n, of) => of ? `${Math.round(n * 100 / of)}%` : '–';
const tile = (label, value, sub, cls) => `<div class="tile" data-key="${esc(label)}"><div class="label">${label}</div><div class="value ${cls || ''}">${value}</div><div class="sub">${sub}</div></div>`;
function scoreboard(s) {
  const st = s.stats;
  const seg = `<span class="seg">${['24h', '7d', '30d', 'all'].map((w) => `<button class="${w === scoreWin ? 'cur' : ''}" onclick="setWin('${w}')">${w}</button>`).join('')}</span>`;
  if (!st) return `<section class="card" id="score"><h2>Scoreboard <span class="cfg">what the loop landed and what it cost</span>${seg}</h2><div class="empty">counting… (bead-supervisor stats, once a minute)</div></section>`;
  const w = st.windows[scoreWin] || st.windows.all;
  const days = Math.max(w.span_s, 3600) / 86400;
  const landed = w.landed, sb = w.send_backs, mt = w.model_time;
  const since = new Date(st.since * 1000).toLocaleDateString([], { month: 'short', day: 'numeric' });
  const needed = w.answers + w.escalations;
  const tiles = [
    tile('Landed', `${landed}<small>${days >= 2 ? `${(landed / days).toFixed(1)} a day` : ''}</small>`, `merged and closed by the loop${w.closed_by_hand ? ` · ${w.closed_by_hand} finished by hand` : ''}${w.closed_unmerged ? ` · ${w.closed_unmerged} PR closed unmerged` : ''}`),
    tile('First try', pct(w.landed_first_try, landed), `${w.landed_first_try} of ${landed} landed with no send-back`),
    tile('Without Claude', pct(w.landed_local, landed), `${w.landed_local} of ${landed} landed by a local model`),
    tile('Rounds per landing', `${w.rounds_per_landed.median == null ? '–' : w.rounds_per_landed.median.toFixed(1)}<small>median</small>`, `${w.rounds_per_landed.mean == null ? '–' : w.rounds_per_landed.mean.toFixed(1)} mean · ${sb.total} send-back${sb.total === 1 ? '' : 's'} in all`),
    tile('Time to land', `${dur(w.time_to_land_s.median)}<small>median</small>`, `first claim → merge · ${dur(w.time_to_land_s.mean)} mean`),
    tile('Needed you', `${needed}`, `${w.escalations} escalated · ${w.answers} answered · ${w.holds} held`, needed ? 'warn' : ''),
  ].join('');
  // where rounds go back: the reasons, most first, as bars against the biggest
  const reasons = Object.entries(sb.by_reason).sort((a, b) => b[1] - a[1]);
  const top = reasons.length ? reasons[0][1] : 1;
  const bars = reasons.length === 0 ? '<div class="empty">no send-backs</div>'
    : `<div class="bars">${reasons.map(([k, n]) => `<span class="k">${esc(k)}</span><span class="bar" title="${n} of ${sb.total}"><i style="width:${Math.round(n * 100 / top)}%"></i></span><span class="n">${n}</span>`).join('')}</div>`;
  const extra = [w.rebases ? `${w.rebases} rebase${w.rebases > 1 ? 's' : ''} (no failure)` : '', w.interrupted ? `${w.interrupted} round${w.interrupted > 1 ? 's' : ''} interrupted by a stop` : ''].filter(Boolean).join(' · ');
  // by model: what each landed, what it lost and why
  const models = [...new Set([...Object.keys(w.landed_by), ...Object.keys(sb.by_model)])].sort((a, b) => (w.landed_by[b] || 0) - (w.landed_by[a] || 0) || a.localeCompare(b));
  const modelRows = models.length === 0 ? '<div class="empty">no rounds yet</div>'
    : `<table><tr><th>model</th><th class="num">landed</th><th class="num">sent back</th><th>why</th></tr>${models.map((m) => {
      const lost = sb.by_model[m] || { total: 0, by_reason: {} };
      const why = Object.entries(lost.by_reason).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)} ${n}`).join(' · ');
      return `<tr data-key="${esc(m)}"><td class="mono">${esc(m)}</td><td class="num">${w.landed_by[m] || 0}</td><td class="num">${lost.total}</td><td class="reasons">${why}</td></tr>`;
    }).join('')}</table>`;
  // model cost: what each role's sessions say they spent (Claude Code's total_cost_usd,
  // opencode's per-step cost; $0 for a local model), the bar its share of the window's
  // spend; empty rounds are a leak to see
  const totalUsd = Math.max(mt.worker_usd + mt.review_usd, 0.01);
  const time = `<div class="bars">
    <span class="k">worker</span><span class="bar" title="${usd(mt.worker_usd)} · ${hours(mt.worker_s)}"><i style="width:${Math.min(100, Math.round(mt.worker_usd * 100 / totalUsd))}%"></i></span><span class="n">${usd(mt.worker_usd)}</span>
    <span class="k">reviewer</span><span class="bar" title="${usd(mt.review_usd)} · ${hours(mt.review_s)}"><i style="width:${Math.min(100, Math.round(mt.review_usd * 100 / totalUsd))}%"></i></span><span class="n">${usd(mt.review_usd)}</span>
  </div><div class="note">${mt.worker_rounds} worker round${mt.worker_rounds === 1 ? '' : 's'} (${hours(mt.worker_s)}), ${mt.review_rounds} review round${mt.review_rounds === 1 ? '' : 's'} (${hours(mt.review_s)}) · ${usd(mt.worker_usd + mt.review_usd)} this window${mt.empty_rounds ? ` · <span class="chip warn" title="a session the harness or server never answered — Claude signed out, a model server down — retried by the loop">${mt.empty_rounds} empty round${mt.empty_rounds > 1 ? 's' : ''}</span>` : ''}</div>`;
  // the beads finished in the window, newest first
  const from = scoreWin === 'all' ? 0 : st.now - { '24h': 86400, '7d': 7 * 86400, '30d': 30 * 86400 }[scoreWin];
  const fin = st.finished.filter((b) => b.closed >= from);
  const shown = scoreAll ? fin : fin.slice(0, FINISHED_SHOWN);
  const more = fin.length > FINISHED_SHOWN ? ` <button class="hist" onclick="setScoreAll(${!scoreAll})">${scoreAll ? '▾ the first ' + FINISHED_SHOWN : '▸ all ' + fin.length}</button>` : '';
  const finished = fin.length === 0 ? '<div class="empty">nothing finished in this window</div>'
    : `<table><tr><th>bead</th><th>title</th><th></th><th class="num">rounds</th><th>landed by</th><th class="num">to land</th><th class="num">closed</th></tr>${shown.map((b) => `
    <tr data-key="${esc(b.id)}"><td class="id">${esc(b.id)}${st.repos.length > 1 ? ` <span class="muted">${esc(b.slug)}</span>` : ''}</td><td class="title"><span class="t" title="${esc(b.title)}">${b.url ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.title)} ↗</a>` : esc(b.title)}</span></td>
        <td class="fit">${b.how === 'landed' ? '<span class="chip ok">landed</span>' : '<span class="chip hand" title="closed by hand after the loop had worked it">by hand</span>'}${b.escalated ? ' <span class="chip warn" title="escalated to the last stage by hand">escalated</span>' : ''}${b.answers ? ` <span class="chip" title="answers you gave">${b.answers} answer${b.answers > 1 ? 's' : ''}</span>` : ''}</td>
        <td class="num">${b.rounds}</td><td class="mono muted fit">${b.how === 'landed' ? esc(b.worker) : ''}</td><td class="num">${b.how === 'landed' ? dur(b.time_to_land_s) : ''}</td><td class="num muted">${ago(b.closed, s.now)} ago</td></tr>`).join('')}</table>`;
  const perRepo = st.repos.length > 1 ? ` · ${Object.entries(w.by_repo).map(([k, v]) => `${esc(k)} ${v.landed}`).join(', ')}` : '';
  return `<section class="card" id="score">
    <h2>Scoreboard <span class="cfg">what the loop landed and what it cost · ${scoreWin === 'all' ? `since ${since}` : `the last ${scoreWin}`}${perRepo} · counted ${ago(st.now, s.now)} ago</span>${seg}</h2>
    <div class="tiles">${tiles}</div>
    <div class="score-cols">
      <div><h3>Where rounds go back<span class="n">${sb.total}</span></h3>${bars}${extra ? `<div class="note">${extra}</div>` : ''}</div>
      <div><h3>By model</h3>${modelRows}</div>
      <div><h3>Model cost</h3>${time}</div>
    </div>
    <h3>Finished<span class="n">${fin.length}</span><span class="note">newest first · rounds counts the one that landed</span>${more}</h3>${finished}
  </section>`;
}

function repo(r, now, ticking) {
  const stages = r.stages.map((s, i) => `<span title="stage ${i + 1}: takes the next ${s.failures} failure${s.failures > 1 ? 's' : ''}"><span class="mono">${esc(s.worker)}</span>${s.reviewer ? ` ⇢ <span class="mono">${esc(s.reviewer)}</span>` : ''} ×${s.failures}</span>`).join(' &nbsp;→&nbsp; ');
  // The human queue: each bead with the question it stopped on, first — the loop's
  // brief asks it (what happened, why, what you have to decide), or, without a brief, the
  // loop's own from the reason — then what happened (the brief), the rounds with their
  // logs (the toggle by the count), the bead's notes, and the ways out: an answer (noted
  // on the bead, back to the dev queue at the same stage), a Claude Code session in its
  // worktree with you, the last stage, or a plain reopen.
  const reasonChip = (b) => { const p = b.parked; return !p ? (b.question ? '<span class="chip warn">question</span>' : b.stage ? '<span class="chip" title="in_progress with no record from the loop: parked by hand, or a round a stop cut short">stopped</span>' : '<span class="chip bad">exhausted</span>')
    : p.reason === 'blocked' ? '<span class="chip warn" title="the last stage said BLOCKED: a claim in the bead is false, or a decision is yours">question</span>' : p.reason === 'exhausted' ? '<span class="chip bad" title="every stage has had its failures">exhausted</span>' : p.reason === 'pr_closed' ? '<span class="chip warn" title="its PR was closed on GitHub without merging">PR closed</span>' : `<span class="chip">${esc(p.reason)}</span>`; };
  const askBlock = (b) => {
    const p = b.parked;
    if (!p) return `<div class="ask"><div class="head">Stopped on<span class="muted">no record from the loop — parked by hand, or before it kept one</span></div><pre class="text">${b.why ? `${b.why.when ? `${esc(b.why.when.replace('T', ' ').slice(0, 16))}${b.why.round ? ' ·' + esc(b.why.round) : ''} — ` : ''}${esc(b.why.what)}` : 'no note from the loop'}</pre></div>`;
    const meta = [p.when ? `parked ${esc(String(p.when).replace('T', ' ').slice(0, 16))}` : '', p.stage ? `stopped on stage ${esc(p.stage.index)} (${esc(p.stage.worker)})` : '', p.brief_model ? `brief by ${esc(p.brief_model)}` : 'no brief: the loop\'s own question'].filter(Boolean).join(' · ');
    return `<div class="ask"><div class="head">The question<span class="muted">${meta}</span></div><pre class="text">${esc(p.question || '')}</pre></div>`
      + (p.brief ? fold(`brief:${b.id}`, 'what happened, and why', `<pre class="text">${esc(p.brief)}</pre>`) : '')
      + (p.stopped_on && !p.brief ? fold(`stop:${b.id}`, 'what it stopped on', `<pre class="text">${esc(p.stopped_on)}</pre>`) : '');
  };
  const human = r.parked.length === 0 ? '<div class="empty">nothing waiting on you</div>' : `<table>${r.parked.map((b) => `
    <tr data-key="${esc(b.id)}"><td class="id">${esc(b.id)}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td>
        <td class="fit">${reasonChip(b)} ${failChip(b.failures)}${histToggle(b)}</td>
        <td class="act">${claudeBtn(r, b)} ${lever('Reopen', 'reopen', { repo: r.repo, id: b.id }, { title: 'back in the dev queue as is' })}</td></tr>
    <tr class="sub" data-key="${esc(b.id)}:why"><td></td><td colspan="3" class="why">${askBlock(b)}${histList(b, r)}${b.notes ? fold(`notes:${b.id}`, 'the bead\'s notes', `<pre class="hist">${esc(b.notes)}</pre>`) : ''}
      <div class="reply">
        ${box(`ans-${b.id}`, 'Your answer, or the context it lacked — goes on the bead under the question; the next round reads both')}
        <div class="actions">${lever('Answer &amp; resume', 'answer', { repo: r.repo, id: b.id }, { cls: 'primary', send: `ans-${b.id}` })}<span class="hint">Ctrl+Enter sends</span>
          <span class="alt">or work it with Claude yourself, in its worktree: <code class="cmd">${esc(b.open_cmd)}</code> <button onclick="copy(${js(b.open_cmd)})" title="copy the command">Copy</button></span></div>
        ${b.waiting && b.waiting.length > 0 ? `<div class="muted">${b.waiting.length} bead${b.waiting.length === 1 ? '' : 's'} wait on it: ${b.waiting.map((id) => esc(id)).join(', ')}</div>` : ''}
      </div></td></tr>`).join('')}</table>`;
  // Held: still in its queue, waiting on something outside the loop — the reason, and
  // where it sits. The loop keeps looking; the flag clears by itself when the world
  // changes (a server back, CI reporting, a merge). Listed with parked, since both are
  // yours to look at, but nothing here needs a Reopen.
  const held = (r.held || []).length === 0 ? '' : `<table>${r.held.map((b) => `
    <tr data-key="${esc(b.id)}"><td class="id">${esc(b.id)}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td>
        <td class="fit"><span class="chip warn">held</span> <span class="muted">in ${esc(b.where)} · ${ago(b.since, now)}</span></td>
        <td class="act">${b.where === 'merge' ? '' : claudeBtn(r, b)}</td></tr>
    <tr class="sub" data-key="${esc(b.id)}:why"><td></td><td colspan="3" class="why">${esc(b.why)}</td></tr>`).join('')}</table>`;
  // Decisions: a bead of type `decision` (or labelled needs-human) in this repo is a
  // question for you, asked by the loop, an agent, or your own planning — the text in
  // full, since it is what you decide on. Answer & close puts the answer on the bead as
  // its close reason, where whoever asked reads it; beads that depended on it unblock.
  const decisions = (r.decisions || []).length === 0 ? '' : `<table class="decisions">${r.decisions.map((d) => `
    <tr data-key="${esc(d.id)}"><td class="id">${esc(d.id)}</td><td class="title"><b>${esc(d.title || '')}</b></td>
        <td class="fit"><span class="chip warn">question</span></td><td class="act"></td></tr>
    <tr class="sub" data-key="${esc(d.id)}:why"><td></td><td colspan="3" class="why"><pre class="text">${esc(d.description || '(no description)')}</pre>
      <div class="reply">
        ${box(`dec-${d.id}`, 'Your decision — goes on the bead as its close reason; whoever asked reads it there')}
        <div class="actions">${lever('Answer &amp; close', 'decide', { repo: r.repo, id: d.id }, { cls: 'primary', send: `dec-${d.id}` })}<span class="hint">Ctrl+Enter sends</span></div>
      </div></td></tr>`).join('')}</table>`;
  // Ready to publish: a proposal an `open_pr = "ask"` round left in proposed/ID, waiting
  // on you. The compare_url to look the diff over, the title and body it would open the
  // PR with — yours to edit, the input and textarea prefilled and (like every box here)
  // patched in place, never rebuilt, so what you typed survives every push. Open PR posts
  // {repo, id, title, body} straight from those two fields to /api/publish.
  const publish = (r.ready_to_publish || []).length === 0 ? '' : `<table>${r.ready_to_publish.map((b) => {
    const p = b.proposal || {}, t = `pub-title-${b.id}`, body = `pub-body-${b.id}`;
    return `<tr data-key="${esc(b.id)}"><td class="id">${esc(b.id)}</td><td class="title"><span class="t" title="${esc(b.title || '')}">${esc(b.title || '')}</span></td>
        <td class="fit"><span class="chip warn">ready to publish</span></td><td class="act"></td></tr>
    <tr class="sub" data-key="${esc(b.id)}:why"><td></td><td colspan="3" class="why">${p.compare_url ? `<div><a href="${esc(p.compare_url)}" target="_blank" rel="noopener">${esc(p.compare_url)} ↗</a></div>` : ''}
      <div class="reply">
        <input id="${esc(t)}" type="text" value="${esc(p.title || '')}">
        <textarea id="${esc(body)}" rows="4">${esc(p.body || '')}</textarea>
        <div class="actions"><button class="primary" onclick="act('publish',{repo:${js(r.repo)},id:${js(b.id)},title:document.getElementById(${js(t)}).value,body:document.getElementById(${js(body)}).value})">Open PR</button></div>
      </div></td></tr>`;
  }).join('')}</table>`;
  // The priority repo: the lanes look at it first on every pass; otherwise round-robin.
  const prio = r.priority
    ? lever('★ priority', 'priority', { repo: 'none' }, { cls: 'prio on', title: 'the lanes look at this repo first on every pass; click to go back to round-robin' })
    : lever('☆ make priority', 'priority', { repo: r.repo }, { cls: 'prio', title: 'the lanes look at this repo first on every pass' });
  return `<section class="card" id="repo-${esc(r.slug)}">
    <h2>${esc(r.slug)} ${prio} <span class="cfg">${esc(r.label)} · ${esc(r.base)} · merge ${esc(r.merge)} · stages: ${stages} · then ${esc(r.on_exhaust)}${r.attach ? '' : ' · <b>no attach</b>: sessions not visible'}</span></h2>
    <div class="queues">${queueCol('dev', r.queues.dev, r, now)}${queueCol('review', r.queues.review, r, now)}${queueCol('merge', r.queues.merge, r, now)}${claudeCol(r)}</div>
    ${strays(r, now)}
    <h3 class="human">Needs you<span class="n">${(r.decisions || []).length + r.parked.length + (r.held || []).length + (r.ready_to_publish || []).length}</span><span class="note">a decision asked of you · a bead parked on a question, exhausted, or its PR closed · a bead held in its queue by something outside the loop · a proposal ready to publish</span></h3>${decisions}${human}${held}${publish}
  </section>`;
}

// One class per kind of line, so the eye can skim the log for the red and the green.
function logClass(m) {
  if (/stopped:|failed|BLOCKED|CI red|rejected|exhausted|parked/.test(m)) return 'bad';
  if (/approved|opened https|pushed a new round|closed \(|merged/.test(m)) return 'good';
  if (/review: |→ review queue/.test(m)) return 'rev';
  if (/dev: bead |→ dev queue/.test(m)) return 'pick';
  if (/^(Starting|Finished|Stopped|Started) |\.service:/.test(m)) return 'sys';
  return '';
}
// systemd's own lines — Starting, Finished, Stopped, the unit's accounting — are the
// journal's, not the loop's: hidden unless asked, and the asking is remembered per browser.
let showSys = false;
try { showSys = localStorage.getItem('showSys') === '1'; } catch { /* no storage: the default, every load */ }
window.setSys = (on) => { showSys = !!on; try { localStorage.setItem('showSys', showSys ? '1' : '0'); } catch { /* not remembered, still applied */ } render(); };

// The log follows its tail until you scroll up to read something, and again once you
// scroll back down: known from the scrolling, not from where it is at render time.
let logTail = true;
document.addEventListener('scroll', (e) => { const t = e.target; if (t && t.id === 'log') logTail = t.scrollHeight - t.scrollTop - t.clientHeight < 12; }, true);

function render() {
  if (!last) return;
  header(last);
  const lines = last.log.map((l) => { const m = l.msg.replace(/^\d\d:\d\d:\d\d /, ''); return { t: l.t, m, cls: logClass(m) }; }).filter((l) => showSys || l.cls !== 'sys');
  const log = last.log.length === 0 ? '<div class="empty">no journal (not running under systemd?)</div>'
    : lines.length === 0 ? '<div class="empty">only systemd’s own lines so far</div>'
    : `<pre class="log" id="log">${lines.map((l) => `<span class="t">${clock(l.t)}</span>  <span class="${l.cls}">${esc(l.m)}</span>`).join("\n")}</pre>`;
  const sysBox = `<label class="opt" title="systemd’s Starting/Finished/Stopped lines for the unit"><input type="checkbox" ${showSys ? 'checked' : ''} onchange="setSys(this.checked)">systemd lines</label>`;
  patch($('main'), (last.error ? `<div class="banner" data-key="error">status failed: ${esc(last.error)}</div>` : '')
    + (last.repos.length === 0 ? '<section class="card" data-key="norepos"><div class="empty">no repos: set <span class="mono">repos</span> in ~/.config/bead-loop/config.toml</div></section>' : lanesPane(last) + scoreboard(last))
    + last.repos.map((r) => repo(r, last.now, last.service.available && (last.service.active === 'active' || last.service.active === 'activating'))).join("")
    + `<section class="card" id="journal"><h3 class="log">Supervisor log${sysBox}</h3>${log}</section>`);
  const el = $('log'); if (el && logTail) el.scrollTop = el.scrollHeight;
  $('foot').textContent = `state as of ${clock(last.now)} · pushed on every change`;
  // The tab says how many things wait on you.
  const waiting = last.repos.reduce((n, r) => n + (r.decisions || []).length + r.parked.length, 0);
  document.title = waiting ? `(${waiting}) bead-loop` : 'bead-loop';
}
// Pushed, not polled: the server sends the whole state whenever anything in it changes.
// EventSource reconnects by itself; the dot says which, and the page dims while the
// stream is down — what it shows is as of the footer's time.
// A hidden tab drops its stream and picks it up again when shown: a browser allows six
// connections to one host, and a forgotten tab holding one is how the seventh "hangs".
// It also means an unwatched page costs the server nothing.
let live = false, es = null;
function setLive(on, text) {
  live = on;
  patch($('live'), on ? '<span class="dot on"></span><span class="muted">live</span>' : `<span class="dot ${text === 'paused' ? '' : 'bad'}"></span><span class="muted">${text || 'reconnecting…'}</span>`);
  if (document.body && document.body.classList) document.body.classList.toggle('stale', !on && !!last && text !== 'paused');
}
function connect() {
  if (es) return;
  setLive(false, 'connecting…');
  es = new EventSource('/api/events');
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.onmessage = (m) => { last = JSON.parse(m.data); render(); };
}
function disconnect() { if (es) { es.close(); es = null; } setLive(false, 'paused'); }
document.addEventListener('visibilitychange', () => (document.hidden ? disconnect() : connect()));
connect();
// Between pushes the clock still moves: re-render the ages every 10 s from the last state.
setInterval(() => { if (last && live) { last.now = Math.floor(Date.now() / 1000); render(); } }, 10000);
</script>
</body>
</html>
