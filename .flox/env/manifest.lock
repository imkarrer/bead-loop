  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "bd": {
        "pkg-path": "beads"
      },
      "cargo": {
        "pkg-path": "cargo"
      },
      "clippy": {
        "pkg-path": "clippy"
      },
      "curl": {
        "pkg-path": "curl",
        "outputs": "all"
      },
      "gcc": {
        "pkg-path": "gcc"
      },
      "gh": {
        "pkg-path": "gh"
      },
      "git": {
        "pkg-path": "git",
        "outputs": "all"
      },
      "jq": {
        "pkg-path": "jq",
        "outputs": "all"
      },
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "opencode": {
        "pkg-path": "opencode",
        "pkg-group": "opencode",
        "version": "1.18.29"
      },
      "rustc": {
        "pkg-path": "rustc"
      },
      "rustfmt": {
        "pkg-path": "rustfmt"
      },
      "shellcheck": {
        "pkg-path": "shellcheck",
        "outputs": "all"
      }
    },
    "vars": {
      "BEAD_LOOP_UI_HOST": "127.0.0.1",
      "BEAD_LOOP_UI_PORT": "4097"
    },
    "hook": {
      "on-activate": "  # the release binary first, then debug (a checkout being worked on), then bin/ (the UI server)\n  export PATH=\"$FLOX_ENV_PROJECT/target/release:$FLOX_ENV_PROJECT/target/debug:$FLOX_ENV_PROJECT/bin:$PATH\"\n  export BEAD_LOOP_HOME=\"$FLOX_ENV_PROJECT\"\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin"
      ]
    },
    "services": {
      "loop": {
        "command": "exec bead-supervisor run"
      },
      "opencode-web": {
        "command": "OPENCODE_DISABLE_CLAUDE_CODE_SKILLS=1 exec opencode serve --port 4096 --hostname 127.0.0.1"
      },
      "ui": {
        "command": "exec \"$FLOX_ENV_PROJECT/bin/bead-loop-ui\""
      }
    }
  },
