  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "bd": {
        "pkg-path": "beads"
      },
      "curl": {
        "pkg-path": "curl",
        "outputs": "all"
      },
      "gh": {
        "pkg-path": "gh"
      },
      "git": {
        "pkg-path": "git",
        "outputs": "all"
      },
      "jq": {
        "pkg-path": "jq",
        "outputs": "all"
      },
      "nodejs": {
        "pkg-path": "nodejs"
      },
      "opencode": {
        "pkg-path": "opencode"
      },
      "shellcheck": {
        "pkg-path": "shellcheck",
        "outputs": "all"
      },
      "yq": {
        "pkg-path": "yq-go"
      }
    },
    "vars": {
      "BEAD_LOOP_UI_HOST": "127.0.0.1",
      "BEAD_LOOP_UI_PORT": "4097"
    },
    "hook": {
      "on-activate": "  export PATH=\"$FLOX_ENV_PROJECT/bin:$PATH\"\n  export BEAD_LOOP_HOME=\"$FLOX_ENV_PROJECT\"\n"
    },
    "options": {
      "systems": [
        "x86_64-linux",
        "aarch64-linux",
        "aarch64-darwin"
      ]
    },
    "services": {
      "loop": {
        "command": "  while :; do\n    \"$FLOX_ENV_PROJECT/bin/bead-supervisor\" tick || true\n    sleep 600\n  done\n"
      },
      "opencode-web": {
        "command": "OPENCODE_DISABLE_CLAUDE_CODE_SKILLS=1 exec opencode web --port 4096 --hostname 127.0.0.1"
      },
      "ui": {
        "command": "exec \"$FLOX_ENV_PROJECT/bin/bead-loop-ui\""
      }
    }
  },
