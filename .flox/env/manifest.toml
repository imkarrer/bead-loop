schema-version = "1.16.0"
# Generated by /floxify
#
# bead-loop's own environment: `flox activate` puts everything the supervisor and the
# UI need on PATH — the tools the README lists (bd, git, jq, gh, opencode, yq, curl)
# plus node for bin/bead-loop-ui and shellcheck for the checks — and bin/ itself, so
# `bead-supervisor` and `bead-loop-ui` resolve without install.sh's ~/.local/bin link.
# install.sh still does what Flox does not: the opencode agent/skill links and the
# systemd units. On a box without systemd, [services] below run the same three things.

[install]
bd.pkg-path = "beads"          # 1.2.2: the bd this project's skills and stubs speak
git.pkg-path = "git"
git.outputs = "all"
gh.pkg-path = "gh"
jq.pkg-path = "jq"
jq.outputs = "all"
yq.pkg-path = "yq-go"          # mikefarah's yq, v4: the supervisor reads its TOML config with it
curl.pkg-path = "curl"
curl.outputs = "all"
opencode.pkg-path = "opencode"
nodejs.pkg-path = "nodejs"     # bin/bead-loop-ui
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"

[vars]
# Where the UI listens. bin/bead-loop-ui reads these; systemd/bead-loop-ui.service
# has the same defaults.
BEAD_LOOP_UI_PORT = "4097"
BEAD_LOOP_UI_HOST = "127.0.0.1"

[hook]
on-activate = '''
  export PATH="$FLOX_ENV_PROJECT/bin:$PATH"
  export BEAD_LOOP_HOME="$FLOX_ENV_PROJECT"
'''

# The three long-running things, for a machine without the systemd units:
# `flox services start` runs them; `flox services logs --follow ui` watches one.
# opencode-web is what `attach = "http://127.0.0.1:4096"` in the global config points at.
[services.opencode-web]
command = '''OPENCODE_DISABLE_CLAUDE_CODE_SKILLS=1 exec opencode web --port 4096 --hostname 127.0.0.1'''

[services.ui]
command = '''exec "$FLOX_ENV_PROJECT/bin/bead-loop-ui"'''

# The loop itself, the timer's job on Linux: one tick, ten minutes, again.
[services.loop]
command = '''
  while :; do
    "$FLOX_ENV_PROJECT/bin/bead-supervisor" tick || true
    sleep 600
  done
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
