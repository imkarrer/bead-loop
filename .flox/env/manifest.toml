schema-version = "1.16.0"
# Generated by /floxify
#
# bead-loop's own environment: `flox activate` puts everything the supervisor and the
# UI need on PATH — the tools the README lists (bd, git, gh, opencode, curl; jq for
# scripts/ci-merge.sh) plus node for bin/bead-loop-ui and shellcheck for the checks —
# and bin/ itself, so `bead-supervisor` and `bead-loop-ui` resolve without install.sh's
# ~/.local/bin link.
# install.sh still does what Flox does not: the opencode agent/skill links and the
# systemd units. On a box without systemd, [services] below run the same three things.

[install]
bd.pkg-path = "beads"          # 1.2.2: the bd this project's skills and stubs speak
git.pkg-path = "git"
git.outputs = "all"
gh.pkg-path = "gh"
jq.pkg-path = "jq"
jq.outputs = "all"
curl.pkg-path = "curl"
curl.outputs = "all"
opencode.pkg-path = "opencode"
opencode.version = "1.18.29"   # 1.18.30 fails every session: TypeError evaluating 'a.name' in SystemPrompt.environment
opencode.pkg-group = "opencode"  # its own group, so the pin does not pull the rest back a catalog page
nodejs.pkg-path = "nodejs"     # bin/bead-loop-ui
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"
# The supervisor is a Rust binary: cargo build --release in this checkout, or CI's.
cargo.pkg-path = "cargo"
rustc.pkg-path = "rustc"
clippy.pkg-path = "clippy"
rustfmt.pkg-path = "rustfmt"
gcc.pkg-path = "gcc"            # the linker cargo calls as cc
# Rust's std links -liconv on macOS, and nixpkgs' gcc there does not bring it.
libiconv.pkg-path = "libiconv"
libiconv.systems = ["aarch64-darwin"]
# GNU coreutils on every system: the supervisor runs every model session under
# `timeout --foreground`, which macOS lacks, so the package carries it (runtime-packages
# below). test/run.sh also speaks GNU and util-linux: timeout, date -d, sed -i, flock,
# setsid; Linux has the rest, macOS has BSD versions or none.
coreutils.pkg-path = "coreutils"
# bash 5 on every system. macOS's /bin/bash is 3.2, which brace-expands a quoted
# "{..,..}" nested in "$(...)": the suite's JSON bodies arrived split at their commas.
# The package carries it too, so the gate and every `bash -c` the loop runs get bash 5.
bash.pkg-path = "bash"
gnused.pkg-path = "gnused"
gnused.systems = ["aarch64-darwin"]
util-linux.pkg-path = "util-linux"
util-linux.systems = ["aarch64-darwin"]

[vars]
# Where the UI listens. bin/bead-loop-ui reads these; systemd/bead-loop-ui.service
# has the same defaults.
BEAD_LOOP_UI_PORT = "4097"
BEAD_LOOP_UI_HOST = "127.0.0.1"

[hook]
on-activate = '''
  # the release binary first, then debug (a checkout being worked on), then bin/ (the UI server)
  export PATH="$FLOX_ENV_PROJECT/target/release:$FLOX_ENV_PROJECT/target/debug:$FLOX_ENV_PROJECT/bin:$PATH"
  export BEAD_LOOP_HOME="$FLOX_ENV_PROJECT"
  # nixpkgs' Rust std on macOS is built for 14.0; gcc links for 11.0 unless told, and
  # warns about every object file.
  if [ "$(uname -s)" = Darwin ]; then export MACOSX_DEPLOYMENT_TARGET=14.0; fi
'''

# The three long-running things, for a machine without the systemd units:
# `flox services start` runs them; `flox services logs --follow ui` watches one.
# opencode-web is what `attach = "http://127.0.0.1:4096"` in the global config points at.
[services.opencode-web]
command = '''OPENCODE_DISABLE_CLAUDE_CODE_SKILLS=1 exec opencode serve --port 4096 --hostname 127.0.0.1'''

[services.ui]
command = '''exec "$FLOX_ENV_PROJECT/bin/bead-loop-ui"'''

# The loop itself: resident, the same thing bead-supervisor.service runs.
[services.loop]
command = '''exec bead-supervisor run'''

# The package `flox install imkarrer/bead-loop` installs: the supervisor, the page,
# bead-loop-install (install.sh: the opencode links, and the launchd agents or systemd
# units), and beside bin/ the agents/, ui/ and skills/ the supervisor finds there
# (config.rs loop_home) and the launchd/ templates. The tools a round shells out to are
# its runtime packages, so they are on its PATH wherever it is installed. opencode is
# not one: a build keeps only toplevel
# packages, and moving the pinned opencode there pulls the whole group back a catalog
# page (Rust 1.98 to 1.97, measured), so the environment that installs this installs
# opencode itself.
# Built from a git checkout, so build.rs stamps the commit. Hooks do not run in a
# build, so the deployment target is set here. On macOS it links with the system cc:
# the env's gcc writes rpaths into its own store paths, which the build's closure
# check refuses.
[build.bead-loop]
description = "Work beads with local and metered models in any repo: the supervisor, its page and its agents"
version.command = '''sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1'''
command = '''
  if [ "$(uname -s)" = Darwin ]; then export MACOSX_DEPLOYMENT_TARGET=14.0 CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=/usr/bin/cc; fi
  cargo build --release --locked
  mkdir -p "$out/bin"
  cp "${CARGO_TARGET_DIR:-target}/release/bead-supervisor" bin/bead-loop-ui "$out/bin/"
  cp install.sh "$out/bin/bead-loop-install"
  cp -R agents ui skills launchd "$out/"
'''
runtime-packages = ["bd", "git", "gh", "jq", "curl", "nodejs", "coreutils", "bash"]

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin"]
