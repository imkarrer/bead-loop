# bead-loop working on itself. Stages (GPU x2 -> Sonnet once, then park) and lanes come
# from ~/.config/bead-loop/config.toml. The gate is the same proof CI runs: baml fmt,
# the BAML tests, shellcheck, the skills lint, and test/e2e on the packed binary. It
# runs inside .flox/ (shellcheck, node, bd and jq from the manifest; baml-cli is
# downloaded by scripts/ensure-baml.sh). A merge to main is released by the pipeline
# and pulled to this box by bead-loop-deploy.timer (scripts/deploy.sh), which
# restarts the loop.
label = "delegate:local"
base = "main"
gate = "flox activate -- bash -c 'export PATH=$(scripts/ensure-baml.sh):$PATH DEVBOX_URL=${DEVBOX_URL:-http://127.0.0.1:8100/v1} ACBOX_URL=${ACBOX_URL:-http://192.168.1.51:8100/v1} DO_NOT_TRACK=1 BAML_CLI_ALLOW_DIRECT=1 BOUNDARY_API_KEY=${BOUNDARY_API_KEY:-local} && baml-cli --agent-skill-check off fmt --check && baml-cli --agent-skill-check off test && bash -n install.sh scripts/*.sh test/lint-skills.sh test/package.sh test/e2e/*.sh test/e2e/cases/*.sh test/e2e/bin/* && bash -n bin/bead-loop-ui && shellcheck -S warning -x install.sh scripts/*.sh test/lint-skills.sh test/package.sh bin/bead-loop-ui test/e2e/*.sh test/e2e/cases/*.sh test/e2e/bin/* && test/lint-skills.sh && test/e2e/parity.sh && node scripts/page-html.mjs --check && node test/ui-onclicks.js test/ui-state.json && scripts/pack.sh target/bead-supervisor && test/e2e/run.sh'"
merge = "pipeline"                   # Buildkite reports, and its automerge step merges a labelled PR on green
primer = "docs/agents/worker.md"     # BAML notes for a worker that has never seen the language
