# What is proven on every push and PR: the crate builds and its tests pass, the scripts
# parse and pass shellcheck, the skills and agents have the frontmatter opencode needs,
# and the supervisor's state machine does what the README's outcome table and
# docs/state-machine.md say (test/run.sh, against the fresh binary with stub
# bd/opencode/gh and a real git origin — no model, no network). The same checks run on
# Buildkite (.buildkite/pipeline.yml), which is also what merges and deploys.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --quiet -- -D warnings
      - name: build + unit tests
        run: cargo build --quiet && cargo test --quiet
      - name: syntax
        run: bash -n install.sh scripts/*.sh test/run.sh test/lint-skills.sh test/bin/* && node --check bin/bead-loop-ui test/ui-onclicks.js
      - name: shellcheck
        run: shellcheck -S warning install.sh scripts/*.sh test/run.sh test/lint-skills.sh test/bin/*
      - name: skills and agents
        run: test/lint-skills.sh
      - name: supervisor state machine
        run: test/run.sh
